<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="estilo.js"></script>
    <script src="iconos.js"></script>
    <script src="cues.js"></script>
    <style>
      /* Fuentes servidas desde el propio proyecto: el render no depende de lo
         que este instalado en la maquina. Inter para todo, y UNA serif italica
         de acento para palabras sueltas de las frases principales. */
      /* Inter variable: cubre todo el rango 100-900, asi tenemos tambien el
         SemiBold 600 que las estaticas (400/700/900) no daban. */
      @font-face { font-family: "Inter"; font-weight: 100 900;
                   src: url("fuentes/Inter-Variable.ttf") format("truetype-variations"); }
      /* Familias del formato editorial: el titulo del gancho y la ficha. Se
         declaran siempre (los archivos viajan con la plantilla) y cada formato elige. */
      @font-face { font-family: "Montserrat"; font-weight: 100 900;
                   src: url("fuentes/Montserrat-Variable.ttf") format("truetype-variations"); }
      @font-face { font-family: "Poppins"; font-weight: 300; src: url("fuentes/Poppins-Light.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 400; src: url("fuentes/Poppins-Regular.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("fuentes/Poppins-Medium.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("fuentes/Poppins-SemiBold.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("fuentes/Poppins-Bold.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("fuentes/Poppins-ExtraBold.ttf"); }
      @font-face { font-family: "CormorantItalic"; font-style: italic; font-weight: 300 700;
                   src: url("fuentes/CormorantGaramond-Italic-Variable.ttf") format("truetype-variations"); }
      @font-face { font-family: "Acento"; font-style: italic;
                   src: url("fuentes/{{SERIF}}") format("truetype"); }

      /* ==========================================================
         SISTEMA BASE — valores medidos sobre la referencia
         subtitulo: centro Y 50.2%, centro X 49.9%, tinta 2.8% del alto,
         1 sola linea, ~64 cambios/min.
         ========================================================== */
      :root {
        /* Los valores vienen de estilo/estilo.json via estilo.js. Lo de aqui es
           solo el respaldo por si se abre el HTML suelto. */
        --safe-x: 10%;
        --sub-y: 50.2%;
        --sub-size: 68px;
        --sub-peso: 700;
        --sub-track: -0.038em;
        --kw-margen: 8%;
        --r-chica: 0.51;
        --r-serif: 0.75;
        --solape: -0.10;
        --interlinea: 0.94;
        /* SOLO DOS COLORES DE TEXTO EN TODO EL VIDEO. Nada mas. */
        --tinta: #ffffff;       /* ~90% de lo que se lee */
        --ocre: #FFDE21;        /* amarillo: el 10% con enfasis */
        /* glow negro muy suave, sin borde: despega la letra del fondo sin
           engordarla ni recortarla */
        --glow: 0 0 14px rgba(0,0,0,.34), 0 0 5px rgba(0,0,0,.42), 0 2px 4px rgba(0,0,0,.32);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: #000;
        font-family: "Inter", -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- A-roll ----------
         El zoom se anima sobre #camara, NUNCA sobre el <video>: animar el
         propio elemento de video hace que Chrome deje de pintar frames. */
      /* El zoom se anima por CLASE, no por id. Cuando hay algo puesto DETRAS del que
         habla, su recorte va en una segunda caja que tiene que moverse exactamente
         igual que el plano: si solo se animara #camara, el recorte se quedaria quieto
         mientras el plano se acerca y se veria un doble desalineado. */
      .camara {
        /* En el formato con marco el plano vive DENTRO de la banda. Dejarlo a pantalla
           completa y taparlo con barras le cortaba la cabeza: lo que las barras ocultan
           es justo donde estaba su frente. */
        position: absolute;
        top: var(--camara-arriba, 0); bottom: var(--camara-abajo, 0);
        left: 0; right: 0;
        transform-origin: 50% 42%;   /* pivote en la cara */
        will-change: transform;
      }
      /* object-position: con marco, el plano se coloca para que la cabeza entre completa (bin/encuadre.py) */
      #aroll, .camara > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% var(--camara-pos-y, 50%); }
      /* El recorte del sujeto: va por encima de los props y por debajo del texto, asi
         que lo que se pone detras queda tapado por su cuerpo y sus manos. */
      /* OJO con el selector: las cajas se llaman detras-0, detras-1... Con `#detras`
         la regla no casaba con ninguna, se quedaban opacas de principio a fin y el
         recorte del sujeto tapaba el video entero. */
      [id^="detras-"] {
        z-index: 4; opacity: 0; visibility: hidden; pointer-events: none;
      }
      /* silueta del sujeto en BLANCO con bloom para el doble flash del gancho: el
         recorte real pasa por brightness(0) invert(1) y queda blanco puro con su alfa */
      #silueta {
        z-index: 4; opacity: 0; visibility: hidden; pointer-events: none;
        filter: brightness(0) invert(1) drop-shadow(0 0 28px rgba(255,255,255,.95)) drop-shadow(0 0 60px rgba(255,255,255,.6));
      }

      /* ---------- FICHA: la pantalla blanca con emoji ----------
         Es lo que hace que el video no sea puro b-roll. El plano CORTA a una pantalla
         blanca con una frase arriba y un simbolo grande debajo, y vuelve. Medido en la
         referencia: fondo blanco puro, texto negro al 28-32% de altura y el objeto del
         32% al 70%, ocupando hasta el 80% del ancho.
         El emoji se elige por lo que se esta diciendo, no siempre el mismo. */
      /* Fuera de su ventana la ficha se esconde de verdad, no solo con opacidad: el
         revisor de contraste no mira la opacidad y veia texto negro sobre el plano
         oscuro, marcando fallos que en pantalla no existen. */
      /* Blanco con textura de lienzo, no un blanco plano: una trama de puntos muy
         suave, casi imperceptible, que le quita el aspecto de pantalla vacia. */
      .stinger.ficha {
        background-color: var(--ficha-fondo, #f7f6f3);
        background-image:
          radial-gradient(rgba(0,0,0,.055) 1px, transparent 1px),
          radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);
        background-size: 14px 14px, 14px 14px;
        background-position: 0 0, 7px 7px;
        visibility: hidden;
      }
      .stinger.ficha .fi-txt {
        position: absolute; left: 8%; right: 8%; top: var(--ficha-txt-y, 29%);
        transform: translateY(-50%);
        font-family: "Inter"; color: var(--ficha-tinta, #101014);
        text-align: center; line-height: 1.1;
      }
      .stinger.ficha .fi-txt .pal {
        display: inline-block; opacity: 0; will-change: transform, opacity;
        font-size: var(--ficha-cuerpo, 104px); font-weight: 800; letter-spacing: -0.02em;
      }
      .stinger.ficha .fi-txt .pal + .pal { margin-left: 0.22em; }
      .stinger.ficha .fi-txt .pal.flojo { font-weight: 600; opacity: .55; }
      /* El simbolo y el subtitulo se componen COMO UN BLOQUE dentro del area de
         respeto (los tres quintos de en medio, 20%-80%). Hay dos composiciones:
           emoji ARRIBA y texto debajo  -> el emoji ocupa 22%-46%, el texto va al 62%
           emoji ABAJO y texto encima   -> el texto va al 38%, el emoji ocupa 54%-78%
         Con las dos piezas siempre dentro de la banda y con aire entre ellas. Antes el
         emoji "abajo" caia hasta el 88% — fuera de lo visible — y el texto se quedaba
         en su sitio de siempre, en medio: se leia como dos cosas sueltas y mal puestas.
         La posicion se fija en % de ALTURA con `top`, nunca con padding (el padding en
         % va sobre el ancho). */
      .stinger.ficha .fi-emo {
        position: absolute; left: 0; right: 0;
        display: flex; justify-content: center; align-items: center;
      }
      .stinger.ficha .fi-emo.arriba { top: 22%; height: 24%; }
      .stinger.ficha .fi-emo.abajo  { top: 54%; height: 24%; }
      .stinger.ficha .fi-emo.centro { top: 38%; height: 24%; }
      /* variantes laterales: misma altura, desplazado al lado libre */
      .stinger.ficha .fi-emo.arriba.izq, .stinger.ficha .fi-emo.abajo.izq { justify-content: flex-start; padding-left: 9%; }
      .stinger.ficha .fi-emo.arriba.der, .stinger.ficha .fi-emo.abajo.der { justify-content: flex-end; padding-right: 9%; }
      .stinger.ficha .fi-emo > img { height: 100%; width: auto; display: block; }
      .stinger.ficha .fi-emo img {
        width: auto; display: block;
      }

      /* Una ficha puede llevar FOTO en vez de emoji: la cara de un cliente cuando el
         guion lo nombra. Va enmarcada y con sombra para que se lea como una pieza
         puesta sobre la ficha, no como un plano a sangre — a sangre competiria con el
         talking head. Ocupa la mitad de la altura util y deja sitio al subtitulo. */
      .stinger.ficha .fi-foto {
        position: absolute; left: 0; right: 0;
        display: flex; justify-content: center; align-items: center;
      }
      .stinger.ficha .fi-foto.arriba { top: 13%; height: 40%; }
      .stinger.ficha .fi-foto.abajo  { top: 45%; height: 40%; }
      .stinger.ficha .fi-foto.centro { top: 29%; height: 40%; }
      .stinger.ficha .fi-foto img {
        height: 100%; width: auto; display: block;
        border-radius: 22px; object-fit: cover;
        box-shadow: 0 10px 34px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.14);
      }

      /* ---------- TOP 10: el rotulo del punto ----------
         Numero grande y titulo debajo. Entra cuando se enuncia el punto y se queda
         hasta el siguiente, mientras abajo el subtitulo va contando la explicacion.
         Son dos trabajos distintos y por eso van en dos sitios distintos. */
      /* El rotulo del TOP 10 es UN SOLO BLOQUE pequeno arriba: una imagen chica y,
         debajo, UNA linea "10 - NUNCA HAGAS X" (numero y texto juntos, nunca sueltos).
         Termina hacia el 12% de alto: el pelo empieza al 18% y la cara al 24%.
         Se coloca con `top`, no con padding (el padding en % va sobre el ancho). */
      #rotulos .rot {
        position: absolute; left: 8%; right: 8%; top: var(--rot-y, 3%);
        display: flex; flex-direction: column; align-items: center; gap: .45em;
        font-family: "Inter"; color: var(--tinta); text-align: center;
        font-size: var(--rot-txt, 44px);
        opacity: 0; pointer-events: none;
      }
      #rotulos .rot img {
        height: var(--rot-img, 106px); width: auto; display: block;
        border-radius: 6px;
      }
      #rotulos .rot .linea {
        font-weight: var(--rot-peso-txt, 800); line-height: 1.1;
        text-transform: var(--rot-caso, uppercase); letter-spacing: .01em;
        color: var(--rot-color, var(--tinta)); font-family: var(--rot-fuente, "Inter");
        text-shadow: var(--rot-sombra, 0 2px 10px rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.55));
      }
      #rotulos .rot .linea .num { font-weight: 900; }
      /* sobre un cielo casi blanco el amarillo no se lee: pastilla oscura suave, solo si el video lo pide */
      #rotulos.pastilla .rot .linea { background: var(--rot-fondo, rgba(0,0,0,.38)); padding: .08em .45em; border-radius: .22em; }
      #rotulos { position: absolute; inset: 0; z-index: 6; pointer-events: none; }

      /* ---------- TOP 10: la lamina de arriba ----------
         Todo el peso del formato esta aqui: una imagen pequena arriba y una linea de
         texto en mayusculas debajo. La mitad de abajo se deja limpia — es lo que hace
         que se lea como una ficha y no como un talking head con subtitulos. */
      #subs.arriba .cue {
        position: absolute; left: var(--safe-x); right: var(--safe-x);
        top: var(--sub-y); transform: translateY(-50%);
        font-family: "Inter"; font-weight: var(--sub-peso, 700);
        font-size: var(--sub-size, 54px);
        letter-spacing: var(--sub-track, 0.01em);
        line-height: var(--sub-interlinea, 1.18);
        text-transform: uppercase;
        color: var(--tinta); text-align: center;
        text-shadow: 0 2px 10px rgba(0,0,0,.72), 0 0 22px rgba(0,0,0,.45);
        opacity: 0;
      }
      .prop.lamina { align-items: flex-start; justify-content: center; }
      .prop.lamina img, .prop.lamina video {
        height: var(--alto, 20%); width: auto; display: block;
      }

      /* ---------- REFLEXIVO: marco y titular fijo ----------
         El video va enmarcado entre dos barras negras. La de arriba lleva un titular
         que NO cambia en todo el video; la de abajo queda vacia, y ese vacio es lo
         que da el aire de pieza pensada en vez de reel. */
      #marco { position: absolute; inset: 0; pointer-events: none; z-index: 7; }
      #marco .barra { position: absolute; left: 0; right: 0; background: var(--marco-fondo, #000); }
      #marco .barra.arriba { top: 0; height: var(--marco-arriba, 16%); }
      #marco .barra.abajo  { bottom: 0; height: var(--marco-abajo, 22%); }
      #titular {
        position: absolute; left: 6%; right: 6%; top: var(--titular-y, 7.5%);
        transform: translateY(-50%);
        font-family: "Inter"; color: var(--tinta); text-align: center;
        line-height: 1.12; z-index: 8; pointer-events: none;
      }
      #titular .t1 { font-weight: var(--titular-peso, 800); font-size: var(--titular-cuerpo, 62px); }
      #titular .t2 { font-weight: var(--titular-peso, 800); font-size: var(--titular-cuerpo2, 44px); }
      #subs.linea .cue {
        position: absolute; left: var(--safe-x); right: var(--safe-x);
        top: var(--sub-y); transform: translateY(-50%);
        font-family: "Inter"; font-weight: var(--sub-peso, 600);
        font-size: var(--sub-size, 46px);
        letter-spacing: var(--sub-track, -0.005em);
        color: var(--tinta); text-align: center; white-space: nowrap;
        text-shadow: var(--sub-halo, 0 2px 9px rgba(0,0,0,.66));
        opacity: 0;
      }
      /* Editorial (ejemplo): cue de dos lineas, prefijo grotesca + palabra en serif
         italica mas grande debajo. El prefijo se queda en la linea del subtitulo; la
         italica cuelga debajo. */
      #subs.linea .cue.dos { white-space: normal; display: flex; flex-direction: column; align-items: center; gap: 0;
        transform: translateY(calc(var(--sub-size, 46px) * -1.15)); }   /* la pareja se centra en la linea del subtitulo: la italica no baja al borde */
      #subs.linea .cue.dos .pre { font-size: var(--sub-size, 46px); line-height: 1.0; }
      #subs.linea .cue.dos .ita {
        font-family: var(--ita-fuente, "Acento"), serif; font-style: italic; font-weight: var(--ita-peso, 600);
        font-size: var(--ita-size, 131px); line-height: 0.95; letter-spacing: var(--ita-track, -0.06em);
        margin-top: -0.04em; white-space: nowrap; color: var(--tinta);
      }
      /* pastilla oscura suave detras del subtitulo, solo si el video lo pide (cielo blanco) */
      #subs.linea.pastilla .cue { background: var(--sub-fondo, rgba(0,0,0,.35)); padding: .06em .4em; border-radius: .2em; }
      #subs.linea.pastilla .cue.dos { padding: .06em .5em .12em; }
      /* el acento del reflexivo: amarillo y en CURSIVA, sin halo. Discreto. */
      #subs.linea .cue em, #subs.linea .cue .acento {
        font-style: italic; color: var(--ocre); font-weight: 700;
      }

      /* ---------- Props: recortes y tarjetas ----------
         Las imagenes que ponen EN ESCENA lo que se dice. Van POR ENCIMA del plano y
         del b-roll pero POR DEBAJO del texto: en las referencias los subtitulos
         cruzan por delante del recorte, nunca al reves. Sin desenfoque de bordes ni
         velo: son piezas limpias, es lo que las hace parecer parte de la escena y no
         un adorno pegado. */
      .prop {
        /* La caja ocupa el cuadro entero y la imagen se coloca dentro con flex. Asi
           el `transform` que anima GSAP queda libre: con `translateX(-50%)` puesto en
           el CSS para centrar, la primera tween lo borraba y la pieza saltaba de
           sitio. */
        position: absolute; inset: 0; opacity: 0; z-index: 3;
        display: flex; pointer-events: none; will-change: transform, opacity;
      }
      .prop img, .prop video { display: block; width: auto; height: var(--alto, 46%); }
      .prop.tarjeta img, .prop.tarjeta video {
        border-radius: 22px;
        /* filo claro finito + sombra: es lo que la despega del fondo sin recurrir a
           un halo desenfocado */
        box-shadow: 0 0 0 3px rgba(255,255,255,.92), 0 18px 44px rgba(0,0,0,.45);
      }
      /* Capturas dibujadas: notificaciones de mensaje y chats. No hay archivo, es
         markup — asi el texto sale nitido a cualquier tamano y se escribe en espanol
         neutro. El avatar es la inicial sobre un circulo: una cara real en una
         notificacion recreada seria suplantar a alguien. */
      .prop.captura { font-family: "Inter"; }
      .prop.captura .cap-pila,
      .prop.captura .cap-tel { height: var(--alto, 26%); display: flex; }
      /* La pila no puede ocupar el ancho entero: en las referencias las
         notificaciones son una columna estrecha arrimada a un lado, y a pantalla
         completa la primera se salia por el canto. */
      .prop.captura .cap-pila {
        flex-direction: column; gap: 0.9%; justify-content: flex-start; width: 80%;
      }
      .cap-dm {
        display: flex; align-items: center; gap: 0.22em; flex: 1;
        background: rgba(24,24,27,.94); border-radius: 999px;
        /* el hueco en em, no en px: si va en px el avatar se come el mensaje
           en cuanto la tarjeta cambia de tamano y el texto sale cortado */
        padding: 0 0.26em 0 0.16em; min-width: 0;
        box-shadow: 0 10px 30px rgba(0,0,0,.45);
      }
      /* OJO con el `em` de aqui: el ancho se resuelve contra el cuerpo del PROPIO
         elemento, no contra el del padre. Con font-size 0.34em, un ancho de 2em son
         0.68 del alto de la fila — que es lo que se busca. Puesto como 0.78em salia
         a un cuarto de fila y el avatar se quedaba colgando fuera de la pastilla. */
      .cap-av {
        width: 2em; height: 2em; border-radius: 50%; flex: none;
        background: linear-gradient(135deg, #f0517a, #f7a83c);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-weight: 800; font-size: 0.34em;
      }
      .cap-av.chico { width: 1.9em; height: 1.9em; }
      .cap-tx { min-width: 0; }
      .cap-de   { color: #fff; font-weight: 700; font-size: 0.30em; line-height: 1.25; }
      .cap-msg  { color: #d6d6da; font-weight: 500; font-size: 0.26em; line-height: 1.3;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cap-hora { color: #8b8b91; font-weight: 500; font-size: 0.22em; line-height: 1.3; }
      .cap-punto { width: 0.16em; height: 0.16em; border-radius: 50%;
                   background: #ff3b5c; margin-left: auto; flex: none; }
      /* chat */
      .cap-tel {
        flex-direction: column; aspect-ratio: 9 / 15;
        background: #0f1614; border-radius: 26px; overflow: hidden;
        box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 18px 44px rgba(0,0,0,.5);
      }
      .cap-cab { display: flex; align-items: center; gap: 10px;
                 padding: 3.4% 5%; background: #1d2b26; }
      .cap-est { color: #9fd6c2; font-size: 0.20em; font-weight: 500; }
      .cap-cuerpo { flex: 1; display: flex; flex-direction: column; gap: 2.2%;
                    padding: 4% 5%; justify-content: flex-end; }
      .cap-bur { max-width: 78%; border-radius: 14px; padding: 2.6% 4%;
                 color: #eaf3ef; font-size: 0.24em; font-weight: 500; line-height: 1.35;
                 position: relative; }
      .cap-bur.yo   { align-self: flex-end;   background: #14614a; }
      .cap-bur.otro { align-self: flex-start; background: #26312d; }
      .cap-h { display: block; text-align: right; color: #9aa5a0;
               font-size: 0.72em; margin-top: 2px; }

      /* ---------- La OFERTA: lo que se vende, en pantalla ----------
         El ultimo tercio de las referencias se construye alrededor de esto: la clase
         o el ebook aparece grande, centrado abajo, con un resplandor calido detras y
         una etiqueta encima — "ESTE" en cursiva pequena y "EBOOK" en bold. Se queda
         siete u ocho segundos, que es el momento en que se decide la conversion. */
      /* OJO con el eje: en una columna, `align-items` es el eje HORIZONTAL y
         `justify-content` el vertical. Puesto al reves, la tarjeta salia pegada
         arriba y a la derecha, con la etiqueta fuera de cuadro. */
      /* La imagen del recurso va JUSTO DEBAJO del subtitulo, no en el suelo: por
         debajo del 80% de la altura ya no se ve bien.
         OJO: un `padding` en % se calcula sobre el ANCHO, no sobre el alto. Puesto
         como padding-top: 72% la imagen se iba al 40% de altura y encima diminuta.
         Se coloca con `top`, que si va sobre el alto. */
      .prop.oferta.abajo, .prop.oferta {
        display: block;
      }
      .prop.oferta .of-caja {
        position: absolute; top: var(--of-y, 70%); left: 50%;
        transform: translateX(-50%);
        height: var(--alto, 20%);
      }
      .prop.oferta .of-etq {
        font-family: "Inter"; text-align: center; color: var(--tinta);
        text-shadow: var(--glow); margin-bottom: 0.35em;
      }
      .prop.oferta .of-arriba {
        font-style: italic; font-weight: 600; font-size: 0.42em; opacity: .92;
        letter-spacing: 0.02em;
      }
      .prop.oferta .of-abajo {
        font-weight: 800; font-size: 0.72em; letter-spacing: -0.01em;
        margin-top: -0.12em;
      }
      /* La caja necesita ALTURA propia: un `height` en % dentro de un padre sin
         altura definida se ignora, y la imagen salia a tamano natural — 1080 px de
         alto desbordando por arriba. */

      /* el resplandor: es lo que despega el producto del fondo sin recortarlo */
      .prop.oferta .of-caja::before {
        content: ""; position: absolute; inset: -14% -10%;
        background: radial-gradient(closest-side, var(--of-luz, rgba(255,92,48,.85)),
                                    rgba(255,92,48,0) 72%);
        filter: blur(26px); z-index: -1;
      }
      .prop.oferta img, .prop.oferta video {
        height: 100%; width: auto; display: block;
        border-radius: 10px;
      }

      .prop.abajo      { align-items: flex-end;   justify-content: center; }
      .prop.abajo-izq  { align-items: flex-end;   justify-content: flex-start; }
      .prop.abajo-der  { align-items: flex-end;   justify-content: flex-end; }
      .prop.izq        { align-items: center;     justify-content: flex-start; padding-left: 2%; }
      .prop.der        { align-items: center;     justify-content: flex-end;   padding-right: 2%; }
      .prop.arriba     { align-items: flex-start; justify-content: center;    padding-top: 3%; }
      .prop.arriba-izq { align-items: flex-start; justify-content: flex-start; padding: 7% 0 0 4%; }
      .prop.arriba-der { align-items: flex-start; justify-content: flex-end;   padding: 7% 4% 0 0; }

      /* ---------- Subtitulos en DOS LINEAS (formato impacto) ----------
         Copiado de las referencias: no hay bloque de tres registros ni serifa.
         Los subtitulos van EN PAREJAS — la entradilla pequena arriba y las
         palabras clave grandes debajo — y las dos lineas se van juntas. Todo en
         la misma sans (Inter), que es lo que pidio el usuario.
         Medido sobre 'y es el de / las preguntas': 82px arriba, 106px abajo. */
      #subs.dos .par {
        position: absolute; left: 0; right: 0; top: var(--sub-y);
        transform: translateY(-50%);
        opacity: 0;
      }
      /* Caja interior: es la que viaja cuando la palabra del CTA se queda fija. El
         centrado de .par se hace con `transform`, asi que animar la `y` de .par le
         borraria el translateY y daria un salto. */
      #subs.dos .par-mov {
        display: flex; flex-direction: column; align-items: center;
        gap: 0; text-align: center;
      }
      #subs.dos .clave span { display: inline-block; white-space: pre; }

      /* una palabra sola, y la del CTA, se pintan por encima del cuerpo normal */
      #subs.dos .clave.suelta { font-size: calc(var(--sub-clave, 106px) * var(--sub-suelta, 1.22)); }
      #subs.dos .clave.es-cta { letter-spacing: 0.01em; }
      /* El amarillo tiene MENOS luminancia que el blanco: medido en el render, el
         nucleo del glifo daba 197 contra 255 del blanco — un 26% mas oscuro. Puesto
         solo con el color, la palabra acentuada llamaba MENOS que el texto normal,
         justo lo contrario de lo que se busca. Se compensa con halo propio del mismo
         amarillo: no sube la luminancia del glifo, pero enciende el area alrededor y
         es lo que hace que el ojo se vaya ahi. */
      #subs.dos .clave span.acento,
      #subs.dos .clave span.cta,
      #subs.dos .clave.acento,
      #subs.dos .clave.cta {
        color: var(--ocre);
        text-shadow:
          0 0 0.10em var(--ocre),
          0 0 0.26em rgba(255, 222, 33, .55),
          0 2px 10px rgba(0, 0, 0, .55);
      }
      #subs.dos .lead, #subs.dos .clave {
        font-family: "Inter"; letter-spacing: var(--sub-track, -0.02em);
        line-height: var(--sub-interlinea, 1.06);
        max-width: 100%;   /* el margen ya lo pone #subs; restarlo dos veces achica */
        /* NUNCA se parte sola. Si el navegador puede partir la linea, el ajuste de
           cuerpo deja de servir: mide un ancho ya recortado por la propia caja y
           cree que cabe cuando en realidad se ha partido en dos renglones. Con
           nowrap el ancho que se mide es el de verdad y el bucle encoge hasta que
           entra. Es lo mismo que hace el subtitulo normal desde el principio. */
        white-space: nowrap;
        text-shadow: var(--glow);
      }
      #subs.dos .lead {
        font-size: var(--sub-lead, 82px); font-weight: var(--sub-peso-lead, 700);
        color: var(--tinta); opacity: var(--sub-op-lead, 0.82);
      }
      #subs.dos .clave {
        font-size: var(--sub-clave, 106px); font-weight: var(--sub-peso-clave, 800);
        color: var(--tinta);
        /* Las dos lineas casi se tocan. Con el interlineado normal quedaba un hueco
           del doble del alto de la letra y las dos lineas se leian como dos cosas
           separadas, no como un bloque. Medido en las referencias: el hueco entre
           las tintas es un 20% del alto de la letra. */
        margin-top: calc(-1 * var(--sub-pegado, 0.20) * 1em);
      }
      /* UN SOLO acento de color, amarillo, tanto para la palabra de enfasis como para
         la del CTA. Las referencias usan rojo y ambar por separado, pero el rojo se
         apaga contra la camisa negra y el fondo oscuro: el amarillo llama mas. */


      /* ---------- Subtitulos ---------- */
      #subs {
        position: absolute; left: var(--safe-x); right: var(--safe-x);
        top: var(--sub-y); transform: translateY(-50%);
        text-align: center; pointer-events: none;
      }
      #subs .cue {
        position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
        /* el subtitulo normal es Inter Regular y SOLO blanco. Sin excepciones. */
        font-size: var(--sub-size); font-weight: var(--sub-peso);
        letter-spacing: var(--sub-track);
        color: var(--tinta); white-space: nowrap; opacity: 0;
        text-shadow: var(--glow);
      }

      /* ---------- Keyword: palabra por palabra, sustituye al subtitulo ---------- */
      #keys { position: absolute; inset: 0; pointer-events: none; }
      /* Bloque tipografico mixto, copiado de la referencia (medido en el frame 51.35s):
         3 lineas con ratio de tamano 0.51 : 1 : 0.75, la grande manda el ancho,
         la italica va sangrada y alineada a la derecha con ella, y las lineas
         casi se tocan (2-4px de tinta a tinta) para que el bloque se lea como
         una sola pieza y no como tres renglones sueltos. */
      #keys .kw {
        position: absolute; left: var(--safe-x); right: var(--safe-x);
        top: var(--sub-y); transform: translateY(-50%);
        /* el bloque animado puede acercarse mas al borde que el subtitulo normal:
           es el elemento que tiene que dominar la pantalla */
        left: var(--kw-margen); right: var(--kw-margen);
        display: flex; flex-direction: column; align-items: flex-start;
        width: fit-content; max-width: 100%; margin: 0 auto;
        color: var(--tinta);   /* la sombra la ponen las filas, sin halo oscuro */
        /* COLCHON. El acomodo pega cada linea al borde del bloque, y entre el vuelo
           de la italica y lo que la caja de la fila no cuenta del glifo, la palabra
           acababa fuera de cuadro y cortada. Este colchon la mantiene dentro sin
           renunciar al escalonado, que es lo que le da caracter al bloque. */
        padding-inline: var(--colchon, 90px);
      }
      .bloque .fila {
        white-space: nowrap; line-height: var(--interlinea);
        /* Halo oscuro (para despegar del fondo) MAS un brillo tenue del propio
           color de la letra. Se usa currentColor para que el brillo sea blanco
           sobre el texto blanco y ocre sobre el ocre, sin declararlo dos veces.
           La opacidad se controla con color-mix: a plena opacidad emborrona. */
        /* Brillo del propio color MAS un halo oscuro flojo. Sin el halo la letra
           perdia fuerza contra el fondo; con el halo completo del subtitulo normal
           se leia como borde. Este es una version aligerada y SIN el componente
           desplazado (0 2px 4px), que era justo el que hacia efecto contorno:
           solo desenfoque centrado, que da separacion sin dibujar un canto. */
        text-shadow:
          0 0 var(--luz-radio, 30px)
            color-mix(in srgb, currentColor var(--luz, 35%), transparent),
          var(--glow-bloque, 0 0 18px rgba(0,0,0,.30), 0 0 7px rgba(0,0,0,.34));
      }
      /* La linea grande va en MAYUSCULAS: el bloque de caja alta se lee mas
         geometrico. Los registros chico y remate mantienen su caja natural,
         asi el contraste no depende solo del tamano. */
      .bloque .fila.chica {
        font-family: "Inter"; font-weight: 700;
        /* Igual que la serifa: la linea pequena NO crece cuando el bloque sube de
           cuerpo. Solo la palabra central cambia de tamano segun lo corta que sea;
           arriba y abajo se mantienen uniformes en todo el video, que es lo que
           hace que los bloques se lean como un mismo sistema y no como piezas
           sueltas de tamanos distintos. */
        /* PROPORCIONAL a la linea grande, con suelo y techo. Estuvo fija en 56px
           y salio mal: cuando una frase larga hacia bajar el cuerpo grande, la
           linea de en medio acababa MAS PEQUENA que esta y que la serifa. La
           jerarquia se invertia y el bloque perdia el sentido. El techo evita que
           crezca de mas en frases cortas, que era el problema original. */
        font-size: clamp(24px, calc(var(--g) * var(--r-chica, 0.42)), 62px);
        letter-spacing: -0.015em;
        /* se pega a la linea grande hasta casi tocarla */
        margin-bottom: calc(var(--g) * var(--solape-chica, -0.06));
      }
      .bloque .fila.grande {
        font-family: "Inter"; font-weight: 900; text-transform: uppercase;
        font-size: var(--g); letter-spacing: -0.03em;
      }
      /* la italica: sangrada, pegada a la de arriba y alineada a su derecha */
      .bloque .fila.serif {
        font-family: "Acento", serif; font-style: italic; font-weight: 500;
        /* Proporcional a la grande, con techo: acompana, no compite. Antes iba fija
           en 84px y en frases largas acababa siendo la linea MAS GRANDE del bloque. */
        font-size: clamp(30px, calc(var(--g) * var(--r-serif, 0.62)), 96px);
        letter-spacing: var(--track-serif, -0.055em);
        /* la italica se mete un poco POR DEBAJO de la grande: los ascendentes de
           la serifa se cuelan en el hueco de la caja alta y el bloque se lee como
           una sola pieza en vez de tres renglones */
        margin-top: calc(var(--serif-px, 84px) * var(--solape) * 1.33);
      }
      /* la alineacion de cada registro la fija el JS segun el acomodo elegido */
      .bloque .fila.izq { align-self: flex-start; }
      .bloque .fila.med { align-self: center; }
      .bloque .fila.der { align-self: flex-end; }
      .bloque .fila.ocre { color: var(--ocre); }
      /* Cada palabra es una pieza independiente que YA esta colocada en su sitio
         definitivo desde el primer frame; solo se revela. Se anima opacity y
         transform, que no afectan al layout: por eso ninguna palabra se mueve
         nunca para hacerle hueco a otra. La frase entera se acomoda a la
         pantalla de golpe (ver ajustar()), no palabra a palabra. */
      /* OJO: aqui habia un segundo `#keys .kw { display:flex; flex-wrap:wrap; ... }`
         que NO repetia flex-direction, asi que devolvia el bloque a direccion FILA.
         Las tres lineas dejaban de apilarse y se repartian a lo ancho: con frases
         largas cada linea llenaba su renglon y parecia correcto, pero con lineas
         cortas se colocaban una al lado de otra y las palabras acababan pegadas a
         los bordes o cortadas ("cada" saliendose por la derecha). El bloque es una
         COLUMNA; quien coloca cada linea a izquierda, centro o derecha es su
         `align-self` (las clases .izq/.med/.der de arriba). */
      .bloque .pal { display: inline-block; opacity: 0; will-change: transform, opacity; }
      .bloque .pal + .pal { margin-left: 0.24em; }
      /* PALETA CERRADA: blanco por defecto, mostaza para el enfasis,
         rojo excepcional. bin/montar.sh rechaza cualquier otro color. */


      /* ---------- Stingers ----------
         Tres capas: el grafico (que hace el push), el desenfoque de bordes que
         le da profundidad, y el grano. El texto va POR ENCIMA de las tres:
         ni se mueve ni se desenfoca. */
      /* CAPAS. El orden del DOM no basta: el b-roll tapaba los subtitulos en los
         diez tramos del video, sin excepcion. Se fija a mano quien va encima.
         El b-roll es imagen de fondo y la narracion sigue corriendo por encima;
         un motion graphic si toma la pantalla, pero trae su propio texto y
         bin/cuadrar.py ya retira los subtitulos que caen dentro. */
      .stinger { position: absolute; inset: 0; opacity: 0; overflow: hidden; z-index: 2; }
      .stinger.broll { z-index: 1; }
      #subs  { z-index: 5; }
      #keys  { z-index: 6; }
      #clave { z-index: 8; }
      #flash { z-index: 9; }

      .stinger .grafico {
        position: absolute; inset: 0;
        transform-origin: 50% 48%;   /* el push va hacia donde esta el texto */
        will-change: transform;
      }
      /* Profundidad de campo: desenfoca lo que hay detras SOLO en los bordes.
         La mascara deja el centro limpio y va cerrando hacia fuera, asi el ojo
         se va al centro y la imagen deja de ser plana. */
      .stinger .dof {
        position: absolute; inset: 0; pointer-events: none;
        backdrop-filter: blur(var(--st-blur, 16px));
        -webkit-backdrop-filter: blur(var(--st-blur, 16px));
        -webkit-mask-image: radial-gradient(closest-side at 50% 48%,
          rgba(0,0,0,0) 36%, rgba(0,0,0,.5) 68%, rgba(0,0,0,1) 100%);
                mask-image: radial-gradient(closest-side at 50% 48%,
          rgba(0,0,0,0) 36%, rgba(0,0,0,.5) 68%, rgba(0,0,0,1) 100%);
      }
      /* Vineteado suave: acompana al desenfoque, no lo sustituye */
      .stinger .vineta {
        position: absolute; inset: 0; pointer-events: none;
        /* muy suave: acompana al desenfoque para dar profundidad, no para
           convertir la imagen en un ovalo negro */
        background: radial-gradient(closest-side at 50% 48%,
          rgba(0,0,0,0) 56%, rgba(0,0,0,.13) 84%, rgba(0,0,0,.26) 100%);
      }
      /* Grano de pelicula. Solo sobre el motion graphic, nunca sobre el texto. */
      .stinger .grano {
        position: absolute; inset: -6%; pointer-events: none;
        opacity: var(--st-grano, 0.16); mix-blend-mode: overlay;
        background-repeat: repeat;
        background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='7'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='180' height='180' filter='url(%23n)'/></svg>");
      }
      .stinger.navy   { background: radial-gradient(120% 90% at 50% 55%, #0d2b6b 0%, #061230 55%, #02060f 100%); }
      .stinger.rojo   { background: radial-gradient(120% 90% at 50% 55%, #7a0b14 0%, #2a0308 55%, #0b0102 100%); }
      .stinger.negro  { background: radial-gradient(120% 90% at 50% 45%, #1a1a1e 0%, #0a0a0c 60%, #000 100%); }
      .stinger.verde  { background: radial-gradient(120% 90% at 50% 55%, #0b4d33 0%, #042116 55%, #010806 100%); }

      /* TONOS CLAROS. Para la marca los graficos van en fondo claro, no nocturno.
         Sobre claro hay que invertir DOS cosas o no se lee nada: la tinta pasa a
         verde oscuro, y el acento deja de ser el verde claro de los subtitulos
         (que sobre crema desaparece) para volverse un verde profundo. El halo del
         bloque tambien se invierte: negro alrededor de letra oscura la ensucia. */
      .stinger.crema  { background: radial-gradient(120% 90% at 50% 48%, #fbf7ef 0%, #f0e8d8 58%, #e3d7c2 100%); }
      .stinger.menta  { background: radial-gradient(120% 90% at 50% 48%, #f2fbf4 0%, #dcf2e2 58%, #c3e6cf 100%); }
      .stinger.salvia { background: radial-gradient(120% 90% at 50% 48%, #f4f7f0 0%, #e2ebdb 58%, #cbd9c2 100%); }
      .stinger.crema, .stinger.menta, .stinger.salvia {
        --tinta: #16302a;
        --ocre: #0f7a4c;
        --glow-bloque: 0 0 18px rgba(255,255,255,.75), 0 0 7px rgba(255,255,255,.85);
        --glow: 0 0 14px rgba(255,255,255,.7), 0 0 5px rgba(255,255,255,.8);
        color: #16302a;
      }
      .crema .acento, .menta .acento, .salvia .acento { color: #0f7a4c; }
      /* sobre claro, la vineta oscura del tratamiento comun ensucia el fondo */
      .stinger.crema .vineta, .stinger.menta .vineta, .stinger.salvia .vineta { opacity: .18; }
      .acento { color: #3f7dff; }
      .rojo .acento  { color: #ff2f45; }
      .verde .acento { color: #35e08a; }
      .negro .acento { color: #f0c750; }

      /* anillos concentricos */
      .anillos { position: absolute; inset: 0; }
      .anillos i {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
        border-radius: 50%; border: 2px solid currentColor; opacity: .55;
        filter: drop-shadow(0 0 18px currentColor);
      }
      /* malla en perspectiva */
      .malla {
        position: absolute; inset: -12%;
        background-image:
          repeating-linear-gradient(to right, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 84px),
          repeating-linear-gradient(to bottom, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 84px);
        -webkit-mask-image: radial-gradient(58% 46% at 50% 50%, #000 55%, transparent 100%);
                mask-image: radial-gradient(58% 46% at 50% 50%, #000 55%, transparent 100%);
        transform: perspective(900px) rotateX(18deg) scale(1.15);
      }
      /* barras de datos */
      .barras {
        position: absolute; left: 14%; right: 14%; top: 26%; height: 30%;
        display: flex; align-items: flex-end; gap: 26px;
      }
      .barras b {
        flex: 1; border-radius: 12px 12px 0 0; background: currentColor;
        box-shadow: 0 0 34px currentColor; opacity: .9; height: 0;
      }
      /* linea de pulso */
      .pulso { position: absolute; left: 0; right: 0; top: 30%; height: 26%; }
      .pulso svg { width: 100%; height: 100%; }
      .pulso path {
        fill: none; stroke: currentColor; stroke-width: 7;
        stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 16px currentColor);
      }
      /* flecha de tendencia */
      .flecha { position: absolute; inset: 0; }
      .flecha svg { width: 100%; height: 100%; }
      .flecha path, .flecha polygon {
        stroke: currentColor; fill: none; stroke-width: 9;
        stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 20px currentColor);
      }
      .flecha polygon { fill: currentColor; }
      /* cifra gigante */
      .cifra {
        position: absolute; left: 0; right: 0; top: 24%;
        text-align: center; font-size: 240px; font-weight: 900;
        color: currentColor; letter-spacing: -0.05em;
        filter: drop-shadow(0 0 44px currentColor);
      }
      /* B-roll del usuario: llena el cuadro y se recorta, nunca se deforma. */
      .broll { position: absolute; inset: 0; overflow: hidden; }
      /* Velo bajo el texto SOLO en b-roll. Los motion graphics son oscuros y no lo
         necesitan, pero el material real puede venir claro y ahi el texto blanco sin
         halo se pierde. Es un degradado, no una caja: no se lee como recuadro. */
      /* El b-roll NO se oscurece. Antes llevaba un velo negro de arriba abajo para
         que el subtitulo se leyera; se quita porque apagaba el material, que es lo
         que se ha ido a buscar. Lo unico que queda alrededor es el desenfoque
         (.dof). La legibilidad del subtitulo la sostiene su propio halo. */
      .stinger.broll .vineta { display: none; }
      .broll video, .broll img {
        position: absolute; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
      }

      /* Iconos (Lucide, ISC). Son de trazo y usan currentColor, asi que heredan
         el acento del stinger y el glow se agarra a la linea. Nunca se ponen
         planos: llevan halo, respiracion y un desenfoque que se limpia al entrar. */
      /* El icono y su texto se leen como UNA pieza: se agrupan en la franja
         central en vez de irse a los extremos dejando un hueco muerto en medio.
         Las alturas caen cerca de las lineas de tercio (33% y 66%). */
      .icono { position: absolute; left: 0; right: 0; display: grid; place-items: center; }
      .icono.arriba { top: 36%; transform: translateY(-50%); }
      .icono.medio  { top: 48%; transform: translateY(-50%); }
      .icono.abajo  { top: 64%; transform: translateY(-50%); }

      /* --- composiciones de icono: que no siempre entre igual --- */
      /* asomado: enorme y cortado por un lado, solo se ve la mitad */
      /* asomado: se sale por un lado, pero poco: cortar medio icono lo vuelve
         una mancha sin forma. Un tercio fuera basta para que se lea "asomado". */
      .icono.asomado-izq { left: -13%; right: auto; width: 62%; }
      .icono.asomado-der { right: -13%; left: auto; width: 62%; }
      .icono.asomado-izq svg, .icono.asomado-der svg { width: 100%; height: auto; }
      /* inclinado: fuera del eje, apoyado a un lado */
      .icono.inclinado { transform: translateY(-50%) rotate(-13deg); }
      .icono.inclinado.der { left: 18%; right: -10%; }
      .icono.inclinado.izq { left: -10%; right: 18%; }
      /* patron: una retícula tenue detras y el icono grande delante */
      .patron {
        display: grid; grid-template-columns: repeat(5, 1fr);
        align-content: center; justify-items: center; gap: 5% 2%;
        opacity: .13; pointer-events: none;
      }
      .patron svg { width: 118px; height: 118px; stroke: currentColor; stroke-width: 1.6; }

      /* BANDA UTIL: la pantalla en 6 partes; los 4 sextos del medio (16.7%-83.3%)
         son lo que la gente ve de verdad. El sexto de arriba lo tapa la lupa de
         IG/TikTok y el de abajo el nombre y la descripcion. Ninguna pieza grafica
         puede tener su masa fuera de esa banda. */
      .duo, .esquinas, .patron {
        position: absolute;
        /* el orden importa: `inset` despues de top/bottom los anulaba */
        left: 0; right: 0;
        top: var(--banda, 17%); bottom: var(--banda, 17%);
      }

      /* duo: dos iconos, uno grande a un lado y otro menor al contrario, girados
         en sentidos opuestos. Llena el ancho sin que el ojo lo lea como simetria. */
      .duo span {
        position: absolute; display: block;
        filter: drop-shadow(0 0 30px currentColor) drop-shadow(0 0 80px currentColor);
      }
      .duo span svg { stroke: currentColor; stroke-width: 1.25; width: 100%; height: auto; }
      .duo .uno { left: -5%; top: 1%;    width: 50%; transform: rotate(-14deg); }
      .duo .dos { right: -3%; bottom: 1%; width: 37%; transform: rotate(11deg); opacity: .72; }

      /* esquinas: tres iconos cortados por los bordes; el espacio deja de estar
         vacio sin que ninguno compita con el texto del centro */
      .esquinas span {
        position: absolute; display: block; opacity: .55;
        filter: drop-shadow(0 0 26px currentColor);
      }
      .esquinas span svg { stroke: currentColor; stroke-width: 1.2; width: 100%; height: auto; }
      .esquinas .a { left: -7%; top: 0;      width: 42%; transform: rotate(-18deg); }
      .esquinas .b { right: -5%; top: 30%;   width: 34%; transform: rotate(14deg); }
      .esquinas .c { left: 15%; bottom: 0;   width: 38%; transform: rotate(8deg); opacity: .4; }
      .icono svg {
        width: var(--ic-tam, 470px); height: var(--ic-tam, 470px);
        stroke: currentColor; stroke-width: 1.35;   /* mas fino: a este tamano el 2 pesa */
        filter: drop-shadow(0 0 26px currentColor) drop-shadow(0 0 70px currentColor);
      }
      /* halo detras del icono, para que no flote sobre el fondo */
      .icono .halo {
        position: absolute; width: var(--ic-halo, 700px); height: var(--ic-halo, 700px);
        border-radius: 50%; background: radial-gradient(circle, currentColor 0%, transparent 62%);
        opacity: .20;
      }

      /* orbe: objeto en la mitad de ARRIBA */
      .orbe { position: absolute; inset: 0; }
      .orbe i {
        position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%);
        border-radius: 50%; display: block;
      }
      .orbe i:first-child {
        width: 300px; height: 300px;
        background: radial-gradient(circle at 38% 34%, #fff, currentColor 46%, transparent 72%);
        filter: drop-shadow(0 0 60px currentColor);
      }
      .orbe i:last-child {
        width: 520px; height: 520px; border: 2px solid currentColor; opacity: .4;
        filter: drop-shadow(0 0 24px currentColor);
      }
      /* ondas: objeto en la mitad de ABAJO */
      .ondas { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; }
      .ondas svg { width: 100%; height: 100%; }
      .ondas path { fill: currentColor; opacity: .30; }
      .ondas path:last-child { opacity: .55; }

      /* franjas de alerta */
      .alerta {
        position: absolute; left: -20%; right: -20%; top: 22%; height: 34%;
        background: repeating-linear-gradient(-45deg,
          currentColor 0 46px, transparent 46px 92px);
        opacity: .32;
      }

      /* badge numerado */
      .badge {
        position: absolute; left: 50%; top: 13%; transform: translateX(-50%);
        width: 156px; height: 156px; border-radius: 36px;
        display: grid; place-items: center;
        background: linear-gradient(160deg, #ffd400, #8a6a00);
        box-shadow: 0 0 60px rgba(255,212,0,.55), inset 0 0 0 4px rgba(255,255,255,.85);
        font-size: 96px; font-weight: 900; color: #fff;
        text-shadow: 0 4px 14px rgba(0,0,0,.5);
      }
      /* El texto del stinger usa el MISMO bloque que las frases principales.
         Lo unico que cambia es donde se coloca, y eso lo decide donde esta el
         objeto del grafico:
           arriba (26%) -> el objeto ocupa la mitad de abajo
           medio  (50%) -> no hay objeto principal (una planicie, un fondo)
           abajo  (72%) -> el objeto ocupa la mitad de arriba
         26% y 72% estan elegidos para no meterse ni en la barra de busqueda de
         IG/TikTok (arriba) ni en el nombre y la descripcion (abajo). */
      .stinger .texto {
        position: absolute; left: var(--kw-margen); right: var(--kw-margen);
        display: flex; flex-direction: column; align-items: flex-start;
        width: fit-content; max-width: 100%; margin: 0 auto;
        transform: translateY(-50%);
        color: var(--tinta);
      }
      /* Alturas pensadas para que el par icono+texto quede agrupado en la franja
         central, cerca de las lineas de tercio (33% / 66%), y no repartido entre
         los dos extremos con un vacio en medio. */
      .stinger .texto.arriba { top: 38%; }
      .stinger .texto.medio  { top: 50%; }
      .stinger .texto.abajo  { top: 63%; }
      /* con icono asomado por un lado, el texto se centra: el icono ya rompe la
         simetria horizontalmente, no hace falta romperla tambien en vertical */
      .stinger .texto.junto  { top: 55%; }

      /* ---------- Lista acumulativa (formato la referencia) ---------- */
      #banner {
        position: absolute; left: var(--safe-x); right: var(--safe-x); top: 5.5%;
        text-align: center; opacity: 0;
      }
      #banner .l1 {
        font-size: 62px; font-weight: 900; color: #fff; text-transform: uppercase;
        -webkit-text-stroke: 9px #000; paint-order: stroke fill;
      }
      #banner .l2 {
        font-size: 46px; font-weight: 700; font-style: italic; color: #fff;
        -webkit-text-stroke: 8px #000; paint-order: stroke fill; margin-top: 6px;
      }
      #lista {
        position: absolute; left: var(--safe-x); right: 20%; bottom: 12%;
        display: flex; flex-direction: column-reverse; gap: 30px;
      }
      #lista .item { display: flex; align-items: flex-start; gap: 14px; opacity: 0; }
      #lista .num {
        font-size: 74px; font-weight: 900; color: #fff; line-height: .95;
        -webkit-text-stroke: 9px #000; paint-order: stroke fill;
      }
      #lista .cuerpo { padding-top: 6px; }
      #lista .tit {
        font-size: 54px; font-weight: 900; color: var(--ocre); text-transform: uppercase;
        -webkit-text-stroke: 9px #000; paint-order: stroke fill; line-height: 1.05;
      }
      #lista .sub {
        font-size: 38px; font-weight: 600; font-style: italic; color: #fff; margin-top: 2px;
        -webkit-text-stroke: 7px #000; paint-order: stroke fill;
      }

      /* PALABRA CLAVE DEL CTA: la que el espectador tiene que recordar ("comenta X").
         Se fija arriba, dentro de la banda util pero por encima de la cabeza, y se
         queda hasta el final. Lleva pastilla oscura detras para que se lea sobre
         cualquier fondo sin depender del contraste del video. */
      /* EL NUMERO DEL PUNTO. En un video de lista el espectador tiene que saber en
         que punto va sin reconstruirlo del audio. Aparece arriba cuando se dice y se
         queda hasta el punto siguiente. Va mas arriba que la palabra del CTA para no
         pelearse con ella si coinciden. */
      #numero {
        /* A la altura de la palabra del CTA, no mas arriba: por encima del 18% esta
           la lupa de busqueda de Instagram y TikTok y el numero se pierde ahi. */
        position: absolute; left: 0; right: 0; top: 20.5%;
        transform: translateY(-50%);
        display: flex; justify-content: center; opacity: 0; pointer-events: none;
        z-index: 8;
      }
      #numero span {
        font-family: "Inter"; font-weight: 900; font-size: 150px; line-height: 1;
        letter-spacing: -0.05em; color: var(--ocre);
        padding: 0.02em 0.20em 0.10em;
        border-radius: 0.16em;
        background: rgba(0,0,0,.34);
        text-shadow: var(--glow);
      }

      #clave {
        position: absolute; left: 0; right: 0; top: 20.5%;
        transform: translateY(-50%);
        display: flex; justify-content: center; opacity: 0; pointer-events: none;
      }
      #clave span {
        font-family: "Inter"; font-weight: 900; font-size: var(--clave-px, 138px);
        letter-spacing: -0.03em; color: var(--ocre); text-transform: uppercase;
        padding: 0.06em 0.26em; border-radius: 0.20em;
        background: rgba(0,0,0,.42);
        box-shadow: 0 0 0 3px rgba(240,192,32,.30), 0 10px 40px rgba(0,0,0,.35);
        text-shadow: 0 0 26px rgba(240,192,32,.45), 0 0 8px rgba(0,0,0,.5);
      }

      /* ---------- Editorial: el TITULO APILADO del gancho ----------
         Lineas de texto literal del habla, apiladas arriba, que entran UNA A UNA y
         alternan peso (negrita / fina). Un bloque puede sustituir al anterior. Cada
         linea puede ir desplazada (dx en % del ancho) para el escalonado de la
         referencia ("Estas son" a la izquierda, "las 3" corrido a la derecha). */
      #gancho { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 7; pointer-events: none; }
      #gancho .bloque {
        position: absolute; left: var(--gan-x, 6%); right: var(--gan-x, 6%);
        top: var(--gan-y, 6.5%);
        display: flex; flex-direction: column; align-items: center;
        font-family: var(--gan-fuente, "Montserrat"); color: var(--gan-color, #fff);
        text-align: center; line-height: var(--gan-interlinea, 0.92); opacity: 0;
        text-shadow: var(--gan-sombra, none);
      }
      #gancho .bloque.escalera, #gancho .bloque.izq { align-items: flex-start; left: var(--gan-x-izq, 9%); }
      #gancho .bloque .ln { opacity: 0; white-space: nowrap; letter-spacing: var(--gan-track, -0.08em); }
      #gancho .bloque .ln.negrita { font-weight: var(--gan-peso-negrita, 800); font-size: var(--gan-negrita, 116px); }
      #gancho .bloque .ln.negrita.grande { font-size: var(--gan-negrita-grande, 141px); }
      #gancho .bloque .ln.fina    { font-weight: var(--gan-peso-fina, 300);    font-size: var(--gan-fina, 118px); }
      #gancho .bloque .ln.media   { font-weight: var(--gan-peso-media, 800);   font-size: var(--gan-media, 110px); }
      #gancho .bloque .ln .cifra  { font-size: 1.22em; line-height: 0.7; vertical-align: -0.02em; display: inline-block; }   /* 'las 3', '+40': el digito fino va mas grande que su palabra, sin agrandar la caja de la linea */
      #gancho .bloque .ln img { height: 1.05em; vertical-align: -0.18em; display: inline-block; margin-left: .18em; }

      /* ---------- Editorial: la FICHA DE COLOR ----------
         Pantalla de color liso (oliva en la referencia) con frases en serif italica
         que se construyen linea a linea. Sustituye al subtitulo mientras dura. */
      .stinger.color { background-color: var(--fc-fondo, #6b7a2b); visibility: hidden; }
      .stinger.color .fc-txt {
        position: absolute; left: 7%; right: 7%; top: var(--fc-y, 44%); transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: .08em;
        font-family: var(--fc-fuente, "Acento"), serif; font-style: italic;
        color: var(--fc-tinta, #fff); text-align: center; line-height: var(--fc-interlinea, 0.88);
        letter-spacing: var(--fc-track, -0.09em);
      }
      .stinger.color .fc-txt .ln { opacity: 0; font-size: var(--fc-cuerpo, 118px); font-weight: var(--fc-peso, 600); }
      .stinger.color .fc-txt .ln.grande { font-size: var(--fc-grande, 170px); }

      /* ---------- Editorial: el CTA "Comenta" + palabra ----------
         La palabra Comenta en blanco y, debajo, la palabra clave en amarillo ENTRE
         COMILLAS, sin pastilla ni halo de color: limpio, como la referencia. */
      #clave.comenta { flex-direction: column; align-items: center; gap: .04em; }
      #clave.comenta .cmt {
        font-family: var(--cta-fuente-comenta, "Inter"); font-weight: var(--cta-peso-comenta, 600);
        font-size: var(--cta-comenta, 100px); color: #fff; letter-spacing: -0.03em;
        text-shadow: var(--cta-halo, 0 0 36px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.45));
      }
      #clave.comenta span {
        font-family: var(--cta-fuente, "Poppins"); font-weight: var(--cta-peso, 700);
        background: none; box-shadow: none; padding: 0; border-radius: 0; color: var(--cta-color, var(--ocre));
        letter-spacing: 0; text-shadow: var(--cta-halo, 0 0 36px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.45));
      }
      #clave.comenta span::before { content: "\201C"; }
      #clave.comenta span::after  { content: "\201D"; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DUR}}"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="camara" class="camara">
        <video
          id="aroll"
          class="clip"
          src="aroll.mp4"
          playsinline
          data-has-audio="true"
          data-start="0"
          data-media-start="0"
          data-duration="{{DUR}}"
          data-volume="{{VOLVOZ}}"
          data-track-index="0"
        ></video>
      </div>

      <!-- El b-roll se declara AQUI en el HTML, no se inyecta por JS: HyperFrames
           compila los clips de video del HTML inicial y un <video> creado despues
           no queda registrado en la linea de tiempo (se renderiza en negro).
           bin/montar.sh sustituye este marcador. -->
      {{BROLL}}
      {{PROPS}}
      {{DETRAS}}
      {{MARCO}}
      <div id="rotulos"></div>
      <div id="gancho"></div>
      <div id="stingers" data-track-index="1"></div>

      <div id="banner" data-track-index="2">
        <div class="l1">"NO VAS A PERDER GRASA"</div>
        <div class="l2">"si te sucede esto ⬇..."</div>
      </div>
      <div id="lista" data-track-index="2"></div>

      <div id="subs" data-track-index="3"></div>
      <div id="keys" data-track-index="4"></div>
      <div id="clave" data-track-index="5"><span>{{CLAVE}}</span></div>
      <div id="numero" data-track-index="5"><span></span></div>
      <div id="flash" data-track-index="6"></div>

      <!-- SFX: una sola pista pre-mezclada. Un unico <audio> en vez de N. -->
      <audio
        id="musica"
        src="musica.wav"
        data-start="0"
        data-media-start="0"
        data-duration="{{DUR}}"
        data-volume="{{VOLMUS}}"
        data-track-index="7"
      ></audio>

      <audio
        id="sfx"
        src="sfx.wav"
        data-start="0"
        data-media-start="0"
        data-duration="{{DUR}}"
        data-volume="{{VOLSFX}}"
        data-track-index="6"
      ></audio>
    </div>

    <script>
      const CUES = window.__CUES__ || [];
      const KEYWORDS = window.__KEYWORDS__ || [];
      const BEATS = window.__BEATS__ || { stingers: [], listas: [] };
      const ZOOMS = window.__ZOOMS__ || [];
      const PARES = window.__PARES__ || [];
      // Formato impacto: los subtitulos van en dos lineas y NO hay bloque de tres
      // registros. Las palabras clave dejan de ser un grafico aparte y pasan a ser
      // el color de la linea grande, que es como funcionan las referencias.
      const MODO = ((window.__ESTILO__ || {}).subtitulo || {}).modo || "";
      const DOS = MODO === "dos_lineas";
      // Los otros dos formatos pintan los cues de siempre, pero colocados y vestidos
      // de otra manera: TOP 10 arriba y en mayusculas, REFLEXIVO en una linea pequena
      // abajo del cuadro. No hace falta un pintador nuevo, solo una clase.
      const CLASE_SUBS = { arriba_caps: "arriba", linea: "linea" }[MODO] || "";
      // Cuanto tarda una frase animada en irse del todo. Se declara aqui arriba
      // porque la usan tanto el bloque de keywords como el recorte de subtitulos.
      const SALIDA_KW = 0.16, MARGEN = 0.04;
      const tl = gsap.timeline({ paused: true });

      // Mayuscula inicial SOLO en la primera linea de todo el guion (el gancho).
      // El resto del guion va en minusculas; la unica excepcion es la linea
      // grande de los bloques, que va en mayusculas por CSS.
      const INICIO = Math.min(
        ...(CUES.length ? CUES.map((c) => c.start) : [Infinity]),
        ...(KEYWORDS.length ? KEYWORDS.map((k) => k.at) : [Infinity]),
        ...((BEATS.stingers || []).length ? BEATS.stingers.map((b) => b.at) : [Infinity]));
      // Con titulo apilado del gancho, los primeros cues se quitan (ya estan escritos
      // arriba) y el primer cue que queda NO es el arranque del guion: solo lo es lo
      // que empieza en el frame 0.
      const HAY_GANCHO = !!(((window.__BEATS__ || {}).gancho || {}).bloques || []).length;
      const esArranque = (t) => HAY_GANCHO ? t < 0.05 : Math.abs(t - INICIO) < 0.001;
      const capitalizar = (s) => s.charAt(0).toUpperCase() + s.slice(1);
      // Los NOMBRES PROPIOS no bajan. "Daniel" escrito "daniel" se lee como una falta,
      // no como estilo — y en estos guiones el nombre del cliente es la prueba. Se
      // respeta cualquier palabra que venga capitalizada y NO sea principio de frase:
      // el transcript ya distingue "Daniel" de "Deja" porque la segunda va tras punto.
      let _PROPIOS = null;
      const propios = () => (_PROPIOS ||= new Set(
        (((typeof CFG !== "undefined" && CFG.subtitulo) || {}).propios || [])
          .map((w) => String(w).toLocaleLowerCase("es"))));
      const bajar = (s) => String(s).split(/(\s+)/).map((w, i, a) => {
        const limpio = w.replace(/[^\p{L}\p{N}]/gu, "");
        if (!limpio) return w;
        if (propios().has(limpio.toLocaleLowerCase("es"))) return w;
        return w.toLocaleLowerCase("es");
      }).join("");

      // ============ legibilidad ============
      // Baja el cuerpo hasta que el bloque cabe en la zona segura y no pasa del
      // numero de lineas permitido. Con contorno, dos lineas apretadas se pisan.
      function ajustar(el, maxLineas, cuerpoMax, cuerpoMin) {
        const ancho = el.clientWidth;
        for (let size = cuerpoMax; size >= cuerpoMin; size -= 4) {
          el.style.fontSize = size + "px";
          const lh = parseFloat(getComputedStyle(el).lineHeight) || size * 1.12;
          const lineas = Math.max(1, Math.round(el.scrollHeight / lh));
          // scrollWidth > clientWidth = una palabra sola no cabe ni partiendo linea
          if (lineas <= maxLineas && el.scrollWidth <= ancho + 1) return size;
        }
        return cuerpoMin;
      }

      // ============ keywords: bloque tipografico, palabra por palabra ============
      // Agrupa la frase en el bloque de 3 registros de la referencia:
      //   chica  (Inter Bold, minusculas)  -> las palabras de enlace del principio
      //   grande (Inter Black, mayusculas) -> el nucleo de la frase
      //   serif  (italica de acento)       -> la coda que matiza
      // Se puede fijar a mano con `bloque` en keywords.json; si no, se deduce.
      const ENLACE = new Set(["a","ante","bajo","con","contra","de","desde","durante","en",
        "entre","hacia","hasta","mediante","para","por","segun","según","sin","sobre","tras",
        "y","e","o","u","ni","que","pero","sino","porque","aunque","si","cuando","mientras",
        "como","donde","pues","el","la","los","las","un","una","unos","unas","lo","al","del",
        "mi","tu","su","mis","tus","sus","este","esta","ese","esa","esos","esas","estos",
        "estas","no","ya","se","te","me","le","les","nos","más","menos","muy","tan",
        "es","son","era","eran"]);
      const esEnlace = (w) => ENLACE.has(w.toLowerCase().replace(/[^\wáéíóúñ]/gi, ""));

      // El nucleo son 2 palabras con contenido, no mas. "gente nueva fuera" no es
      // una composicion: lo que se lee grande tiene que ser una unidad de sentido
      // corta, y el resto baja al remate.
      function agrupar(trozos) {
        if (trozos.length <= 2) return [{ rol: "grande", palabras: trozos }];
        let i = 0;
        while (i < trozos.length - 1 && esEnlace(trozos[i].t) && i < 2) i++;
        const nMax = (window.__ESTILO__ || {}).bloque?.palabras_nucleo || 2;
        let j = i, contenido = 0;   // eslint-disable-line
        while (j < trozos.length && contenido < nMax) {
          if (esEnlace(trozos[j].t) && contenido > 0) break;   // el enlace abre el remate
          if (!esEnlace(trozos[j].t)) contenido++;
          j++;
        }
        // SIEMPRE tiene que haber linea pequena arriba cuando la frase da para
        // tres registros. Si no empieza por conector, se sube la primera palabra:
        // sin ella el bloque queda descabezado y se lee como medio bloque.
        if (i === 0 && trozos.length >= 4) {
          i = 1;
          j = i; contenido = 0;
          while (j < trozos.length && contenido < nMax) {
            if (esEnlace(trozos[j].t) && contenido > 0) break;
            if (!esEnlace(trozos[j].t)) contenido++;
            j++;
          }
        }
        const filas = [];
        if (i > 0) filas.push({ rol: "chica", palabras: trozos.slice(0, i) });
        filas.push({ rol: "grande", palabras: trozos.slice(i, j) });
        // El remate en italica no aguanta mucho texto: con mas de cuatro palabras se
        // pierde y ademas obliga a encoger todo el bloque. Se parte en dos lineas.
        const resto = trozos.slice(j);
        const maxS = (window.__ESTILO__ || {}).bloque?.serif_max_palabras || 4;
        for (let k = 0; k < resto.length; k += maxS)
          filas.push({ rol: "serif", palabras: resto.slice(k, k + maxS) });
        return filas;
      }

      // El acomodo es siempre el mismo esquema (una arriba, la grande en medio,
      // el remate abajo) pero cambiando de lado para que no se repita nunca igual.
      const CFG = window.__ESTILO__ || {};
      // Editorial: la altura del subtitulo se decide POR VIDEO segun donde queda
      // la cara (bajo la barbilla si la cabeza esta arriba; sobre la cabeza si la cara
      // ocupa la mitad baja del cuadro, como en caro/ejemplo). beats.subtitulo.y manda.
      // ...y la sombra del titulo del gancho: la referencia va sin sombra sobre salones
      // claros, pero sobre un cielo casi blanco el blanco plano no se lee. beats.titulo_gancho.sombra
      if (((window.__BEATS__ || {}).titulo_gancho || {}).sombra) {
        document.documentElement.style.setProperty("--gan-sombra", window.__BEATS__.titulo_gancho.sombra);
      }
      // ...y la altura del rotulo de lista y del subtitulo mientras hay rotulo, por video
      // (con la cara abajo, el rotulo sube al 8% y el subtitulo se queda arriba).
      if (((window.__BEATS__ || {}).rotulo || {}).y) {
        document.documentElement.style.setProperty("--rot-y", window.__BEATS__.rotulo.y);
      }
      if (((window.__BEATS__ || {}).rotulo || {}).fondo) {
        document.getElementById("rotulos").classList.add("pastilla");
        document.documentElement.style.setProperty("--rot-fondo", window.__BEATS__.rotulo.fondo);
      }
      if (((window.__BEATS__ || {}).subtitulo || {}).halo) {
        document.documentElement.style.setProperty("--sub-halo", window.__BEATS__.subtitulo.halo);
      }
      if (((window.__BEATS__ || {}).subtitulo || {}).fondo) {
        document.getElementById("subs").classList.add("pastilla");
        document.documentElement.style.setProperty("--sub-fondo", window.__BEATS__.subtitulo.fondo);
      }
      if (((window.__BEATS__ || {}).subtitulo || {}).y_con_rotulo) {
        if (CFG.subtitulo) CFG.subtitulo.y_con_rotulo = window.__BEATS__.subtitulo.y_con_rotulo;
      }
      if (((window.__BEATS__ || {}).subtitulo || {}).y) {
        document.documentElement.style.setProperty("--sub-y", window.__BEATS__.subtitulo.y);
        if (CFG.subtitulo) CFG.subtitulo.y = window.__BEATS__.subtitulo.y;
      } else if (CFG.subtitulo && CFG.subtitulo.y === "auto" && window.__SUB_Y__) {
        // medido por video con la cara: debajo de la barbilla, dentro del area de respeto
        document.documentElement.style.setProperty("--sub-y", window.__SUB_Y__);
        CFG.subtitulo.y = window.__SUB_Y__;
      }
      const ACOMODOS = CFG.acomodos || [["izq", "izq", "der"], ["der", "der", "izq"]];

      // Cada registro entra por un lado distinto: el bloque respira en vez de
      // aparecer todo desde el mismo sitio. Recorridos cortos, nunca desde el borde.
      const ENTRADA = CFG.entrada ||
        { chica: { x: -34, y: 0 }, grande: { x: 0, y: 30 }, serif: { x: 38, y: 10 } };

      // Constructor del bloque tipografico. Lo usan las frases principales Y el
      // texto de los motion graphics: mismo sistema, misma lectura.
      function construirBloque(el, trozos, opt) {
        opt = opt || {};
        let filas;
        if (opt.bloque) {
          let n = 0;
          filas = opt.bloque.map(([texto, rol]) => {
            const cuantas = texto.split(/\s+/).length;
            const p = trozos.slice(n, n + cuantas); n += cuantas;
            return { rol, palabras: p };
          }).filter((f) => f.palabras.length);
        } else {
          filas = agrupar(trozos);
        }
        const disp0 = opt.acomodo || ACOMODOS[(opt.idx || 0) % ACOMODOS.length];
        // La linea pequena se alinea SIEMPRE con la grande. Antes cada una tomaba su
        // lado del acomodo y quedaban en extremos opuestos: el bloque se leia como
        // tres piezas sueltas en vez de una. El escalonado lo sigue dando el remate.
        const disp = [...disp0];
        if (filas.length >= 2 && filas[0].rol === "chica") disp[0] = disp[1];
        const acento = opt.acento || null;

        const spans = [];
        filas.forEach((f, fi) => {
          const fila = document.createElement("div");
          const lado = disp[Math.min(fi, disp.length - 1)];
          const esAcento = acento === f.rol ||
            (acento === "remate" && f.rol === "serif") ||
            (acento === "nucleo" && f.rol === "grande");
          fila.className = "fila " + f.rol + " " + lado + (esAcento ? " ocre" : "");
          el.appendChild(fila);
          f.palabras.forEach((p, pi) => {
            const sp = document.createElement("span");
            sp.className = "pal";
            // minusculas siempre, salvo la primerisima palabra del guion
            // sin puntos: en pantalla no aportan y ensucian el remate
            const limpio = bajar(p.t).replace(/\.{2,}|…|\./g, "");
            const primera = fi === 0 && pi === 0 && opt.arranque;
            sp.textContent = primera ? capitalizar(limpio) : limpio;
            sp.style.opacity = 1;
            fila.appendChild(sp);
            spans.push({ el: sp, at: p.at, rol: f.rol });
          });
        });

        // el bloque COMPLETO se acomoda a la pantalla: baja el cuerpo base hasta
        // que cabe entero. Todas las lineas escalan juntas porque van en `em`.
        // El cuerpo no solo BAJA para caber: tambien SUBE cuando la frase es corta.
        // Se busca el tamano mas grande que sigue cabiendo en la zona segura, asi
        // una palabra de cinco letras llena la pantalla en vez de quedarse
        // pequena solo porque el tamano de partida era fijo.
        const B = CFG.bloque || {};
        // ANCHO DE REFERENCIA: se PREGUNTA al DOM, no se da por hecho que son 1080.
        // La pagina se maqueta a un ancho que no tiene por que coincidir con el de
        // la composicion (aqui salian 997 para un video de 1080) y despues se escala
        // al renderizar. Midiendo contra 1080 el margen se calculaba un 8% de mas y
        // las lineas acababan fuera de cuadro: "cada" cortada por el borde derecho.
        const RAIZ = document.querySelector("[data-composition-id]");
        const W = (RAIZ && RAIZ.getBoundingClientRect().width) || 1080;
        const tope = W * (B.ancho_max || 0.84);
        const altoMax = opt.alto_max || B.alto_max || 620;
        const maxG = opt.cuerpo || B.cuerpo_max || 168;
        const minG = B.cuerpo_min || 44;
        // El ancho se mide sobre las FILAS, no sobre el contenedor. El contenedor
        // lleva max-width:100%, asi que su scrollWidth se queda clavado en el ancho
        // de pantalla por muy larga que sea la frase: medido asi, el bucle creia que
        // siempre cabia y las frases largas se salian del cuadro por los dos lados.
        const anchoReal = () => Math.max(el.scrollWidth,
            ...[...el.children].map((f) => f.scrollWidth));

        let elegido = minG;
        for (let g = maxG; g >= minG; g -= 3) {
          el.style.setProperty("--g", g + "px");
          if (anchoReal() <= tope && el.scrollHeight <= altoMax) { elegido = g; break; }
        }
        el.style.setProperty("--g", elegido + "px");

        // Las lineas chica y serif van a tamano FIJO a proposito (asi todos los
        // bloques se leen como un mismo sistema). Pero si la frase es larga, esas
        // dos no encogen con --g y se salen del cuadro: el bucle de arriba baja
        // hasta el minimo, no cabe igual, y la serifa acaba saliendose por la
        // izquierda. Aqui se les aplica el recorte que haga falta, y SOLO cuando
        // hace falta: un bloque normal no se entera.
        if (anchoReal() > tope) {
            const k = tope / anchoReal();
            const px = (v, d) => Math.round(parseFloat(
                getComputedStyle(document.documentElement).getPropertyValue(v) || d) * k);
            el.style.setProperty("--chica-px", px("--chica-px", 56) + "px");
            el.style.setProperty("--serif-px", px("--serif-px", 84) + "px");
        }

        // GUARDIA DE MARGENES. Lo anterior controla el TAMANO, pero no donde acaba
        // cada renglon: con el acomodo a la derecha una linea corta se iba fuera de
        // cuadro y se leia a medias ("cada" cortada por el borde). Aqui se mide la
        // caja real de cada fila en pantalla y, si se sale, se empuja hacia dentro.
        // Se mide, no se supone: es la unica forma de que el margen se cumpla pase
        // lo que pase con el layout.
        const rr = RAIZ ? RAIZ.getBoundingClientRect() : { left: 0, right: W };
        const MARG = W * (parseFloat(B.margen) || 8) / 100;
        [...el.children].forEach((f) => {
          f.style.position = "relative";
          const r = f.getBoundingClientRect();
          const dentro = Math.max(0, (rr.left + MARG) - r.left)
                       - Math.max(0, r.right - (rr.right - MARG));
          if (Math.abs(dentro) > 0.5) f.style.left = Math.round(dentro) + "px";
        });

        // revelar: cada palabra ya esta en su sitio definitivo, solo se muestra
        spans.forEach((sp) => {
          const e = ENTRADA[sp.rol] || ENTRADA.grande;
          gsap.set(sp.el, { opacity: 0, x: e.x, y: e.y, scale: 0.94 });
          tl.to(sp.el, { opacity: 1, x: 0, y: 0, scale: 1,
            duration: e.duracion || 0.30, ease: "power3.out" }, sp.at);
        });
        return spans;
      }

      // Una frase animada y un motion graphic no pueden convivir: el grafico ya
      // trae su propio texto y se pintarian dos bloques a la vez. Si se solapan,
      // manda el grafico y la frase se descarta.
      const STG = BEATS.stingers || [];
      // El b-roll no descarta una frase animada: va debajo de la narracion, no
      // compite con ella. Solo los motion graphics, que traen su propio texto.
      const chocaConGrafico = (k) =>
        STG.filter((b) => b.tipo !== "broll")
           .some((b) => k.at < b.at + (b.dur || 0) && k.at + (k.dur || 0) > b.at);
      // Ni en dos lineas ni en el reflexivo se dibuja el bloque de tres registros: en
      // el primero el texto son las parejas, en el segundo el enfasis va en cursiva
      // dentro de la propia linea. Dibujarlo ademas seria decir dos veces lo mismo.
      const SIN_BLOQUE = DOS || MODO === "linea";
      const KW_VISIBLES = SIN_BLOQUE ? [] : KEYWORDS.filter((k) => !chocaConGrafico(k));

      const kcont = document.getElementById("keys");
      KW_VISIBLES.forEach((k, idx) => {
        const el = document.createElement("div");
        el.className = "kw bloque";
        kcont.appendChild(el);

        const trozos = k.palabras || k.text.split(/\s+/).map((t, i) => ({
          t, at: k.at + i * (k.dur * 0.6) / Math.max(1, k.text.split(/\s+/).length),
        }));

        const spans = construirBloque(el, trozos,
          { bloque: k.bloque, acomodo: k.acomodo, acento: k.acento, cuerpo: k.cuerpo,
            idx, arranque: esArranque(k.at) });

        // La salida NUNCA puede empezar antes de que la ultima palabra haya
        // terminado de aparecer. Si se cruzan, las dos animan la misma opacidad y
        // gana la que acaba mas tarde: la palabra se queda encendida PARA SIEMPRE.
        // Paso de verdad — "comida" se quedo en pantalla veinte segundos, hasta el
        // final del video. La duracion la recorta bin/cuadrar.py para hacer sitio al
        // subtitulo siguiente, y en frases donde la ultima palabra entra justo al
        // final el recorte se metia dentro de su entrada.
        const ultima = Math.max(k.at, ...spans.map((sp) => sp.at));
        const ENTRA_KW = 0.30;
        const fin = Math.max(k.at + k.dur, ultima + ENTRA_KW + 0.04);
        tl.to(spans.map((sp) => sp.el), { opacity: 0, duration: SALIDA_KW, ease: "power2.in" }, fin);
      });

      // ============ stingers ============
      // Biblioteca de fondos. Se elige por lo que se esta diciendo, no por defecto.
      //   anillos  expansion, algo que se propaga, alarma
      //   malla    sistema, estructura, "como funciona"
      //   barras   comparacion, cantidades
      //   pulso    cuerpo, salud, urgencia
      //   flecha   crecimiento, mejora, tendencia
      //   cifra    una estadistica concreta
      //   alerta   peligro, error, lo que NO hay que hacer
      const FONDOS = {
        anillos(cap, b, at) {
          const d = document.createElement("div");
          d.className = "anillos acento";
          [520, 820, 1180, 1520].forEach((w) => {
            const i = document.createElement("i");
            i.style.width = i.style.height = w + "px";
            d.appendChild(i);
          });
          cap.appendChild(d);
          tl.from(d.children, { scale: 0.35, opacity: 0, duration: 0.75,
            stagger: 0.07, ease: "power2.out" }, at);
        },
        malla(cap, b, at) {
          const d = document.createElement("div");
          d.className = "malla";
          cap.appendChild(d);
          tl.from(d, { scale: 1.4, opacity: 0, duration: 0.65, ease: "power2.out" }, at);
        },
        barras(cap, b, at) {
          const d = document.createElement("div");
          d.className = "barras acento";
          const vals = b.valores || [38, 62, 45, 88, 55];
          vals.forEach(() => d.appendChild(document.createElement("b")));
          cap.appendChild(d);
          vals.forEach((v, i) => {
            tl.fromTo(d.children[i], { height: "0%" },
              { height: v + "%", duration: 0.42, ease: "power3.out" }, at + i * 0.07);
          });
        },
        pulso(cap, b, at) {
          const d = document.createElement("div");
          d.className = "pulso acento";
          d.innerHTML =
            '<svg viewBox="0 0 1080 500" preserveAspectRatio="none"><path d="M0,250 L300,250 L340,110 L390,390 L440,180 L480,250 L1080,250"/></svg>';
          cap.appendChild(d);
          const path = d.querySelector("path");
          const len = path.getTotalLength();
