          gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(path, { strokeDashoffset: 0, duration: 0.85, ease: "power1.inOut" }, at);
        },
        flecha(cap, b, at) {
          const d = document.createElement("div");
          d.className = "flecha acento";
          d.innerHTML =
            '<svg viewBox="0 0 1080 1920"><path d="M180,1180 L430,940 L640,1080 L900,700"/>' +
            '<polygon points="900,700 780,720 880,820" stroke-width="0"/></svg>';
          cap.appendChild(d);
          const path = d.querySelector("path");
          const len = path.getTotalLength();
          gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(path, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, at);
          tl.from(d.querySelector("polygon"), { scale: 0, opacity: 0, duration: 0.25,
            ease: "back.out(3)", transformOrigin: "50% 50%" }, at + 0.6);
        },
        cifra(cap, b, at) {
          const d = document.createElement("div");
          d.className = "cifra acento";
          const destino = b.valor != null ? b.valor : 90;
          d.textContent = "0" + (b.sufijo || "");
          cap.appendChild(d);
          const obj = { v: 0 };
          tl.to(obj, {
            v: destino, duration: 0.8, ease: "power2.out",
            onUpdate: () => { d.textContent = Math.round(obj.v) + (b.sufijo || ""); },
          }, at);
          tl.from(d, { scale: 0.7, opacity: 0, duration: 0.3, ease: "back.out(2)" }, at);
        },
        // B-ROLL: material real del usuario (video o imagen). Recibe el MISMO
        // tratamiento que un grafico generado —push lento, desenfoque de bordes,
        // vineta y grano— porque eso es lo que hace que no se note el salto entre
        // material propio y motion graphic: los dos se ven de la misma pelicula.
        // ICONO: el grafico es un pictograma. Sirve para cualquier nicho porque
        // la biblioteca cubre casi todo; el tratamiento es lo que lo hace cinematico.
        icono(cap, b, at) {
          const svg = (window.__ICONOS__ || {})[b.icono];
          if (!svg) return;
          // La composicion rota sola: si el icono entra siempre centrado y del
          // mismo tamano, a la segunda vez el espectador ya sabe lo que viene.
          const comp = b.icono_comp || COMPOS[b.__ci % COMPOS.length];
          const d = document.createElement("div");
          let clases = "icono acento " + (b.icono_pos || "medio");
          if (comp.startsWith("asomado")) clases += " " + comp;
          if (comp.startsWith("inclinado")) clases += " inclinado " + comp.split("-")[1];
          d.className = clases;
          d.innerHTML = (comp === "asomado-izq" || comp === "asomado-der"
                         ? "" : "<span class='halo'></span>") + svg;
          cap.appendChild(d);
          if (comp === "duo" || comp === "esquinas") {
            // el icono unico se retira: la composicion la forman las piezas
            d.remove();
            const g = document.createElement("div");
            g.className = comp + " acento";
            const piezas = comp === "duo" ? ["uno", "dos"] : ["a", "b", "c"];
            g.innerHTML = piezas.map((c) => `<span class="${c}">${svg}</span>`).join("");
            cap.appendChild(g);
            g.querySelectorAll("span").forEach((sp, i) => {
              tl.fromTo(sp,
                { opacity: 0, scale: 0.72, filter: "blur(14px)" },
                { opacity: i === 0 ? 1 : (comp === "duo" ? 0.72 : 0.5), scale: 1,
                  filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, at + i * 0.09);
            });
            return;
          }
          if (comp === "patron") {
            const rej = document.createElement("div");
            rej.className = "patron acento";
            rej.innerHTML = svg.repeat(15);
            cap.insertBefore(rej, d);
            tl.fromTo(rej, { opacity: 0, scale: 1.12 },
              { opacity: 0.13, scale: 1, duration: 0.8, ease: "power2.out" }, at);
          }
          const g = d.querySelector("svg");
          const halo = d.querySelector(".halo");
          // entra desenfocado y grande, y se asienta: lectura de lente enfocando
          tl.fromTo(g,
            { scale: 1.22, opacity: 0, filter: "blur(18px) drop-shadow(0 0 26px currentColor)" },
            { scale: 1, opacity: 1, filter: "blur(0px) drop-shadow(0 0 26px currentColor)",
              duration: 0.52, ease: "power3.out" }, at);
          tl.fromTo(halo, { scale: 0.5, opacity: 0 },
            { scale: 1, opacity: 0.20, duration: 0.7, ease: "power2.out" }, at);
          // respiracion lenta: sin esto el icono se lee como un sello pegado
          tl.to(g, { scale: 1.05, duration: (b.dur || 1.2) + 0.4, ease: "sine.inOut" }, at + 0.5);
          tl.to(halo, { opacity: 0.30, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, at + 0.3);
        },
        // objeto ARRIBA: un orbe con halo. El texto se va abajo.
        orbe(cap, b, at) {
          const d = document.createElement("div");
          d.className = "orbe acento";
          d.innerHTML = "<i></i><i></i>";
          cap.appendChild(d);
          tl.from(d.querySelector("i"), { scale: 0.3, opacity: 0, duration: 0.6,
            ease: "back.out(1.7)", transformOrigin: "50% 50%" }, at);
          tl.from(d.querySelectorAll("i")[1], { scale: 0.5, opacity: 0, duration: 0.8,
            ease: "power2.out", transformOrigin: "50% 50%" }, at + 0.1);
        },
        // objeto ABAJO: ondas que suben desde el borde inferior. El texto arriba.
        ondas(cap, b, at) {
          const d = document.createElement("div");
          d.className = "ondas acento";
          d.innerHTML =
            "<svg viewBox='0 0 1080 700' preserveAspectRatio='none'>" +
            "<path d='M0,420 C180,300 360,540 540,420 C720,300 900,540 1080,420 L1080,700 L0,700 Z'/>" +
            "<path d='M0,520 C200,410 380,630 560,520 C740,410 920,630 1080,520 L1080,700 L0,700 Z'/>" +
            "</svg>";
          cap.appendChild(d);
          const ps = d.querySelectorAll("path");
          tl.from(ps[0], { yPercent: 40, opacity: 0, duration: 0.7, ease: "power2.out" }, at);
          tl.from(ps[1], { yPercent: 55, opacity: 0, duration: 0.8, ease: "power2.out" }, at + 0.08);
        },
        alerta(cap, b, at) {
          const d = document.createElement("div");
          d.className = "alerta acento";
          cap.appendChild(d);
          tl.fromTo(d, { x: -120, opacity: 0 },
            { x: 0, opacity: 0.32, duration: 0.45, ease: "power2.out" }, at);
          tl.to(d, { opacity: 0.14, duration: 0.35, repeat: 3, yoyo: true }, at + 0.45);
        },
      };

      const scont = document.getElementById("stingers");
      // Contador de iconos: la composicion rota por ORDEN de aparicion, no por un
      // hash del instante. Con el hash, dos iconos podian caer en la misma
      // composicion por casualidad y volvia a verse repetitivo.
      const COMPOS = ["duo", "asomado-izq", "esquinas", "inclinado-der",
                      "patron", "asomado-der", "centro", "inclinado-izq"];
      let nIcono = 0;
      // Transicion suave: el stinger entra con fundido cruzado y un empuje de
      // escala, y la camara acompaña con un micro-zoom. Nada de corte seco ni
      // flash blanco: el salto al b-roll tiene que sentirse continuo.
      const ST = CFG.stingers || {};
      const ENTRA = ST.entra || 0.34, SALE = ST.sale || 0.30;

      (BEATS.stingers || []).forEach((b) => {
        // el b-roll ya viene declarado en el HTML; el resto se construye aqui
        const yaHecho = b.tipo === "broll"
          ? document.getElementById("broll-" + b.__bi) : null;
        const cap = yaHecho || document.createElement("div");
        if (!yaHecho) {
          // La ficha NO lleva tono: el tono es lo que pinta el fondo de color del
          // stinger, y aqui el fondo tiene que ser el blanco de la propia ficha.
          cap.className = b.tipo === "ficha" ? "stinger ficha"
                        : b.tipo === "color" ? "stinger color"
                                             : "stinger " + (b.tono || "navy");
          if (b.tipo === "color" && b.fondo) cap.style.backgroundColor = b.fondo;
          scont.appendChild(cap);
        }

        // capa 1: el grafico. Es lo unico que se mueve y lo unico que se desenfoca.
        // La ficha no lo lleva: su fondo es el blanco liso.
        let graf = cap.querySelector(".grafico");
        if (!graf && b.tipo !== "ficha" && b.tipo !== "color") {
          graf = document.createElement("div");
          graf.className = "grafico";
          graf.setAttribute("data-layout-allow-overflow", "");   // el push lo desborda a proposito
          cap.appendChild(graf);
          if (b.tipo === "icono") b.__ci = nIcono++;
          (FONDOS[b.tipo] || FONDOS.anillos)(graf, b, b.at);
          // capa 2 y 3: profundidad de campo, vineta y grano.
          // El desenfoque de bordes se puede apagar por formato: en las referencias
          // de impacto el material entra limpio y a sangre, y el halo de los bordes
          // lo delataba como pieza pegada encima del plano.
          const capas = b.tipo === "ficha" ? []
            : (((CFG.broll || {}).desenfoque === false && b.tipo === "broll")
               ? ["grano"] : ["dof", "vineta", "grano"]);
          capas.forEach((c) => {
            const d = document.createElement("div");
            d.className = c;
            cap.appendChild(d);
          });
        }

        // La FICHA DE COLOR (editorial): pantalla de color liso con frases en
        // serif italica que se construyen linea a linea. Mientras dura, el subtitulo
        // normal se esconde: el texto de la ficha ES lo que se lee.
        if (b.tipo === "color") {
          const tx = document.createElement("div");
          tx.className = "fc-txt";
          if (b.tinta) tx.style.color = b.tinta;
          const lns = (b.lineas || []).map((l) => (typeof l === "string" ? { t: l } : l));
          const FC = CFG.ficha_color || {};
          const cadaC = b.cada != null ? b.cada : (FC.cada != null ? FC.cada : 0.55);
          // tamanos ALTERNADOS grande/normal por linea (referencia ejemplo), empezando en
          // grande, salvo que el beat lo diga a mano
          const aMano = lns.some((l) => l.grande != null);
          lns.forEach((l, i) => {
            const d = document.createElement("div");
            const grande = aMano ? !!l.grande : (i % 2 === 0);
            d.className = "ln" + (grande ? " grande" : "");
            d.textContent = l.t || "";
            tx.appendChild(d);
            const t = l.at != null ? l.at : b.at + 0.1 + i * cadaC;
            // cada linea SUBE ~130px con fade de 0.27s ease-out (medido)
            tl.fromTo(d, { opacity: 0, y: FC.sube_px != null ? FC.sube_px : 130 },
              { opacity: 1, y: 0, duration: FC.fade != null ? FC.fade : 0.27, ease: "power2.out" }, t);
          });
          cap.appendChild(tx);
          tl.set("#subs", { opacity: 0 }, b.at);
          tl.set("#subs", { opacity: 1 }, b.at + b.dur + 0.001);
        }

        // La FICHA no lleva ni grafico de fondo ni tratamiento: es una pantalla
        // blanca con una frase y un simbolo. Se dibuja aparte.
        if (b.tipo === "ficha") {
          const tx = document.createElement("div");
          tx.className = "fi-txt";
          tx.style.display = "none";   // el texto lo lleva el subtitulo, no la ficha
          const trozos = b.palabras || (b.titular || "").split(/\s+/).filter(Boolean)
            .map((t, i, a) => ({ t, at: b.at + 0.10 + i * (b.dur * 0.45) / Math.max(1, a.length) }));
          const flojas = new Set((b.flojas || []).map((x) => x.toLowerCase()));
          const sp = trozos.map((w) => {
            const e = document.createElement("span");
            e.className = "pal" + (flojas.has(String(w.t).toLowerCase()) ? " flojo" : "");
            e.textContent = w.t;
            tx.appendChild(e);
            return { el: e, at: w.at };
          });
          cap.appendChild(tx);
          if (b.foto) {
            const fo = document.createElement("div");
            fo.className = "fi-foto " + (b.foto_sitio || "arriba").replace("-", " ");
            fo.innerHTML = `<img src="props/fotos/${b.foto}" alt="">`;
            cap.appendChild(fo);
            // Entra como una foto que se posa: menos rebote que el emoji (una cara
            // dando botes se lee como broma, y aqui es una prueba).
            tl.fromTo(fo.querySelector("img"),
              { opacity: 0, scale: 0.88, y: 18 },
              { opacity: 1, scale: 1, y: 0, duration: 0.46, ease: "power3.out" },
              b.at + 0.04);
            tl.to(fo.querySelector("img"),
              { scale: 1.045, duration: Math.max(0.2, b.dur - 0.5), ease: "none" },
              b.at + 0.5);
          }
          if (b.emoji) {
            const em = document.createElement("div");
            // `arriba` / `abajo` / `centro`, con `izq` o `der` opcional
            em.className = "fi-emo " + (b.emoji_sitio || "arriba").replace("-", " ");
            em.innerHTML = `<img src="props/emoji/${b.emoji}" alt="">`;
            cap.appendChild(em);
            tl.fromTo(em.querySelector("img"),
              { opacity: 0, scale: 0.72, rotate: -8 },
              { opacity: 1, scale: 1, rotate: 0, duration: 0.42, ease: "back.out(1.8)" },
              b.at + 0.04);
            // late despacio mientras dura: sin esto la pantalla se queda muerta
            tl.to(em.querySelector("img"),
              { scale: 1.06, duration: b.dur, ease: "sine.inOut" }, b.at + 0.46);
          }
          sp.forEach((x) => {
            tl.fromTo(x.el, { opacity: 0, y: 18 },
              { opacity: 1, y: 0, duration: 0.20, ease: "power3.out" }, x.at);
          });
        }

        // push lento del grafico hacia el centro, donde esta el texto.
        // El texto NO va dentro de .grafico, asi que ni se mueve ni se escala.
        const Z = ST.zoom || {};
        if (graf) tl.fromTo(graf,
          { scale: Z.desde || 1.0 },
          { scale: Z.hasta || 1.12, duration: b.dur + ENTRA,
            ease: "none" }, b.at - ENTRA * 0.5);

        // el desenfoque de bordes se abre al entrar: empieza mas cerrado y se
        // limpia conforme la imagen se asienta
        tl.fromTo(cap,
          { "--st-blur": (Z.blur_entra || 30) + "px" },
          { "--st-blur": (Z.blur || 16) + "px", duration: 0.9, ease: "power2.out" },
          b.at - ENTRA * 0.5);
        // el grano respira un poco para que no se lea como una textura pegada
        tl.fromTo(cap.querySelector(".grano"),
          { backgroundPosition: "0px 0px" },
          { backgroundPosition: "180px 120px", duration: b.dur + ENTRA, ease: "none" },
          b.at - ENTRA * 0.5);

        if (b.badge != null) {
          const bd = document.createElement("div");
          bd.className = "badge";
          bd.textContent = b.badge;
          cap.appendChild(bd);
          tl.from(bd, { scale: 0.5, opacity: 0, duration: 0.28, ease: "back.out(2.2)" }, b.at + 0.05);
        }
        // Donde va el texto lo decide donde esta el objeto del grafico. Se puede
        // forzar con `pos` en beats.json.
        const POS = CFG.posicion_texto || {
          anillos: "abajo", malla: "medio", barras: "abajo", pulso: "abajo",
          flecha: "arriba", cifra: "abajo", alerta: "abajo",
          orbe: "abajo", ondas: "arriba", icono: "abajo",
        };
        // En el formato de dos lineas los graficos NO llevan texto: en las
        // referencias todo lo escrito son los subtitulos, y un titular encima de la
        // pareja deja dos textos pisandose en el mismo sitio. El grafico se queda,
        // el texto se va.
        if (b.titular && !DOS && b.tipo !== "ficha") {
          const tx = document.createElement("div");
          // Con un icono, el texto va SIEMPRE al lado contrario del simbolo:
          // simbolo abajo -> texto arriba, simbolo arriba -> texto abajo.
          // El texto se coloca segun DONDE ESTA EL HUECO de la composicion, no
          // segun icono_pos: en `duo` y `esquinas` las piezas ocupan arriba y
          // abajo, asi que el sitio libre es el centro. Atarlo a icono_pos dejaba
          // el texto pegado a un icono teniendo el medio vacio.
          const OPUESTO = { arriba: "abajo", abajo: "arriba", medio: "abajo" };
          const compUsada = b.icono_comp
            || (b.tipo === "icono" ? COMPOS[b.__ci % COMPOS.length] : "");
          const HUECO = {                 // composicion -> donde queda sitio libre
            duo: "medio", esquinas: "medio",
            "asomado-izq": "junto", "asomado-der": "junto",
          };
          const lugar = b.pos
            || (b.tipo === "icono"
                ? (HUECO[compUsada] || OPUESTO[b.icono_pos || "medio"])
                : null)
            || POS[b.tipo] || "medio";
          tx.className = "texto bloque " + lugar;
          cap.appendChild(tx);
          const pal = b.palabras || b.titular.split(/\s+/).map((t, i, a) => ({
            t, at: b.at + 0.10 + i * (b.dur * 0.5) / Math.max(1, a.length),
          }));
          construirBloque(tx, pal, {
            bloque: b.bloque, acomodo: b.acomodo, acento: b.acento,
            cuerpo: b.cuerpo || ST.cuerpo || 96, alto_max: ST.alto_max || 420,
            idx: Math.round(b.at * 7),
            arranque: esArranque(b.at),
          });
        }

        // El contenedor del b-roll tambien se revela aqui: el <video> de dentro lo
        // reproduce HyperFrames, pero si el contenedor sigue invisible no se ve nada.
        if (b.tipo === "ficha" || b.tipo === "color") tl.set(cap, { visibility: "visible" }, b.at - ENTRA * 0.5);
        tl.fromTo(cap,
          { opacity: 0, scale: 1.06 },
          { opacity: 1, scale: 1, duration: ENTRA, ease: "power2.out" }, b.at - ENTRA * 0.5);
        // SALIDA EN SECO, sin fundido. Un fade de salida destapa el clip de abajo
        // justo cuando puede haber un corte, y se leen dos saltos donde deberia
        // haber uno. Entra suave, sale de golpe.
        tl.set(cap, { opacity: 0 }, b.at + b.dur);
        if (b.tipo === "ficha" || b.tipo === "color") tl.set(cap, { visibility: "hidden" }, b.at + b.dur + 0.001);
        // la camara del A-roll cede un poco mientras el stinger toma la pantalla
        tl.to(".camara", { scale: "+=0.04", duration: ENTRA, ease: "power2.out" }, b.at - ENTRA * 0.5);
        tl.set(".camara", { scale: "-=0.04" }, b.at + b.dur);
      });

      // ============ lista acumulativa ============
      const bl = (BEATS.listas || [])[0];
      if (bl) {
        const lc = document.getElementById("lista");
        (bl.items || []).forEach((it, i) => {
          const d = document.createElement("div");
          d.className = "item";
          d.innerHTML = `<div class="num">${i + 1}.</div><div class="cuerpo">` +
            `<div class="tit">${it.tit}</div><div class="sub">${it.sub || ""}</div></div>`;
          lc.appendChild(d);
        });
        lc.querySelectorAll(".tit").forEach((e) => ajustar(e, 1, 54, 30));
        lc.querySelectorAll(".sub").forEach((e) => ajustar(e, 1, 38, 22));
        ajustar(document.querySelector("#banner .l1"), 2, 62, 38);
        ajustar(document.querySelector("#banner .l2"), 1, 46, 28);

        tl.to("#banner", { opacity: 1, duration: 0.2 }, bl.at);
        tl.fromTo("#lista .item", { x: -40, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.22, stagger: 0.28, ease: "power3.out" }, bl.at + 0.1);
        tl.to(["#banner", "#lista .item"], { opacity: 0, duration: 0.18 }, bl.at + bl.dur);
      }

      // ============ subtitulos en dos lineas (formato impacto) ============
      // Una pareja por vez: la entradilla pequena arriba y la linea grande debajo.
      // Las palabras de la grande entran una a una, cuando se dicen; las dos lineas
      // se van juntas. El rojo es el enfasis y el ambar la palabra del CTA — los dos
      // salen medidos de las referencias, no elegidos a ojo.
      const PAREJAS_DIBUJADAS = [];
      // Cuando la palabra del CTA se queda quieta en su renglon, las parejas que
      // vienen despues caerian justo encima. Se apartan hacia abajo lo justo para que
      // se lean las dos: el CTA arriba y lo que sigue debajo.
      let CTA_QUIETO = null;
      // Ventanas de FICHA: mientras una esta en pantalla el subtitulo se calla. La
      // ficha ya lleva el texto (y es cita literal), asi que no se pierde nada; el
      // subtitulo blanco sobre el blanco de la ficha no se leeria y encima ensucia
      // el emoji.
      const FICHAS = (BEATS.stingers || []).filter((b) => b.tipo === "ficha");
      const enFicha = (a, b) => FICHAS.some((f) => a < f.at + f.dur && b > f.at);
      // Ventanas en las que la OFERTA ocupa la parte de abajo. En las referencias,
      // mientras se muestra el producto no hay subtitulo: la etiqueta ocupa su sitio.
      // Aqui no se puede callar lo que se dice, asi que en vez de quitar el texto se
      // sube, y el de abajo se lo queda la oferta.
      const OFERTAS = (window.__PROPS__ || []).filter((p) => p.tipo === "oferta");
      function pintarPares(cont) {
        cont.classList.add("dos");
        const CLARO = (CFG.subtitulo || {});
        PARES.forEach((p) => {
        // Los subtitulos TERMINAN en la palabra clave: lo que se dice despues de
        // "comenta X" solo se oye. Asi la palabra clave se queda sola en pantalla y
        // no compite con nada.
        if (p.tras_cta) return;
          const par = document.createElement("div");
          par.className = "par";
          const mov = document.createElement("div");
          mov.className = "par-mov";
          par.appendChild(mov);
          cont.appendChild(par);

          let lead = null;
          if (p.lead) {
            lead = document.createElement("div");
            lead.className = "lead";
            lead.textContent = bajarSub(p.lead, esArranque(p.at));
            mov.appendChild(lead);
          }
          const clv = document.createElement("div");
          clv.className = "clave";
          mov.appendChild(clv);

          // una palabra por span: entran de a una, al ritmo del habla
          const spans = p.palabras.map((w, i) => {
            const sp = document.createElement("span");
            sp.textContent = bajarSub(w.t, esArranque(p.at) && !p.lead && i === 0) + " ";
            if (w.ambar) {
              sp.className = "cta";
              // En las referencias la palabra del CTA va en MAYUSCULAS y mas grande
              // que la linea de encima: es lo unico que el espectador tiene que
              // recordar, y en minusculas se confunde con el resto del subtitulo.
              sp.textContent = sp.textContent.toLocaleUpperCase("es");
            } else if (w.acento) sp.className = "acento";
            clv.appendChild(sp);
            return { el: sp, at: w.at };
          });
          // el color lo lleva la palabra, pero si TODA la linea es la palabra
          // marcada se pinta la linea entera (asi sale en las referencias)
          if (spans.length === 1 && p.palabras[0].ambar) clv.classList.add("cta");
          else if (spans.length === 1 && p.palabras[0].acento) clv.classList.add("acento");

          // si la pareja cae dentro de una oferta, sube para dejarle el sitio
          // El subtitulo NO se mueve por la oferta. Subirlo lo dejaba encima de su
          // cara. La oferta se coloca pequena y abajo, en su hueco, y el texto se
          // queda donde siempre.
          const of = OFERTAS.find((o) => p.at < o.at + o.dur && p.fin > o.at);
          if (of && of.sube_texto) {
            const raiz = document.querySelector("[data-composition-id]");
            const H = parseFloat((raiz && raiz.dataset.height) || 0) || 1920;
            mov.style.transform = `translateY(${-(of.sube_texto / 100) * H}px)`;
          }
          PAREJAS_DIBUJADAS.push([par, lead, clv]);
          // Una sola palabra abajo pesa mas si ademas es mas grande. "NO" en las
          // referencias sale asi: sola, centrada y por encima del cuerpo normal.
          if (p.palabras.length === 1) clv.classList.add("suelta");
          if (spans.some((sp, k) => p.palabras[k].ambar)) clv.classList.add("es-cta");
          encogerPar(par, lead, clv);
          const spanCTA = spans.find((sp, k) => p.palabras[k].ambar);
          if (spanCTA) fijarCTA(par, mov, lead, spans, spanCTA, p);

          if (lead) {
            tl.fromTo(lead, { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.20, ease: "power3.out" }, p.at);
          }
          spans.forEach((sp) => {
            tl.fromTo(sp.el, { opacity: 0, y: 16 },
              { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, sp.at);
          });
          // La salida no puede empezar antes de que la ultima palabra haya acabado
          // de entrar: si se cruzan, las dos animan la misma opacidad, gana la que
          // acaba mas tarde y la pareja se queda encendida para siempre.
          // Y la pareja se apaga ANTES de que entre la siguiente: dos parejas a la
          // vez en el mismo sitio se pisan y no se lee ninguna.
          const ultima = Math.max(p.at, ...spans.map((sp) => sp.at));
          const SALE = 0.12;
          const salida = Math.max(p.fin - SALE, ultima + 0.18 + 0.02);
          // Sobre la ficha el subtitulo NO se calla: se pinta oscuro. Callarlo se
          // comia las palabras que la ficha no decia.
          //
          // Y el negro dura EXACTAMENTE lo que dura el fondo claro. Con una clase
          // puesta a toda la pareja, el trozo que se salia de la ficha quedaba negro
          // sobre el plano oscuro y no habia quien lo leyera.
          FICHAS.filter((f) => p.at < f.at + f.dur && p.fin > f.at).forEach((f) => {
            const oscuro = { color: "#14141a",
              textShadow: "0 2px 10px rgba(255,255,255,.85), 0 0 20px rgba(255,255,255,.7)" };
            const claro = { color: "", textShadow: "" };
            // Las palabras con acento TAMBIEN van en negro sobre la ficha: el amarillo
            // sobre blanco no se lee. Tienen su propio color por CSS, asi que hay que
            // pisarlo a proposito, y devolverlo al salir.
            const acentos = [...clv.querySelectorAll("span.acento, span.cta")];
            const donde = [lead, clv, ...acentos].filter(Boolean);
            tl.set(donde, oscuro, Math.max(f.at, p.at));
            tl.set(donde, claro, Math.min(f.at + f.dur, p.fin));
            // El texto se mueve CON el emoji: si el emoji va arriba, el texto baja al
            // 62%; si va abajo, el texto sube al 38%. Los dos dentro de la banda y con
            // aire entre ellos. Se calcula sobre la ALTURA de la composicion.
            const raiz = document.querySelector("[data-composition-id]");
            const H = parseFloat((raiz && raiz.dataset.height) || 0) || 1920;
            const base = parseFloat(String((CFG.subtitulo || {}).y || "55%")) / 100;
            const sitio = String(f.emoji_sitio || "arriba");
            const destino = sitio.startsWith("abajo") ? 0.38 : (sitio.startsWith("arriba") ? 0.62 : base);
            const dy = (destino - base) * H;
            tl.set(mov, { y: dy }, Math.max(f.at, p.at));
            tl.set(mov, { y: 0 }, Math.min(f.at + f.dur, p.fin));
          });
          tl.set(par, { opacity: 1 }, p.at);
          // la pareja del CTA no se apaga: su palabra se queda hasta el final
          if (!par.dataset.fija) {
            tl.to(par, { opacity: 0, duration: SALE, ease: "power2.in" }, salida);
          }
        });
      }

      // La palabra del CTA no se va con su pareja: se queda en pantalla hasta el final
      // para que se entienda que es LO importante. Lo demas de la pareja se apaga, y
      // ella sola viaja despacio hasta un sitio donde no estorbe, encogiendo por el
      // camino. Lento y con entrada y salida suaves: si va rapido se lee como un salto
      // de montaje y se pierde justo la sensacion que se busca.
      function fijarCTA(par, mov, lead, spans, spanCTA, p) {
        const F = (CFG.subtitulo || {}).cta_fijo;
        if (!F) return;
        const raiz = document.querySelector("[data-composition-id]");
        // El tamano sale de data-width/data-height, NO de getBoundingClientRect: ese
        // devuelve el tamano EN PANTALLA, ya escalado por el visor, mientras que GSAP
        // anima en pixeles de la composicion. Con el rect, el viaje salia encogido a
        // una fraccion y la palabra se quedaba practicamente donde estaba.
        const caja = {
          width: parseFloat((raiz && raiz.dataset.width) || 0) || 1080,
          height: parseFloat((raiz && raiz.dataset.height) || 0) || 1920,
        };
        const pct = (v, d) => (parseFloat(v) || d) / 100;
        const destino = pct(F.y, 13);
        const origen = pct((CFG.subtitulo || {}).y, 55);
        const dy = (destino - origen) * caja.height;
        const dx = pct(F.x, 0) * caja.width;
        const esc = F.escala || 0.60;
        // OJO: `F.duracion || 1.5` se come el cero, porque 0 es falso en JS. Con
        // duracion 0 (que significa "no viajes, salta") volvia a poner 1.5s de viaje
        // y la palabra se quedaba a medio camino encima del subtitulo.
        let dur = F.duracion != null ? F.duracion : 1.5;
        const espera = F.espera != null ? F.espera : 0.25;

        const SALE = 0.12;
        const ultima = Math.max(p.at, ...spans.map((sp) => sp.at));
        const salida = Math.max(p.fin - SALE, ultima + 0.18 + 0.02);

        // se apaga TODO menos ella
        const resto = spans.filter((sp) => sp.el !== spanCTA.el).map((sp) => sp.el);
        if (lead) resto.push(lead);
        if (resto.length) {
          tl.to(resto, { opacity: 0, duration: SALE, ease: "power2.in" }, salida);
        }
        // y la pareja deja de apagarse entera: la marca para que el pintado normal no
        // le meta su propio fundido de salida
        par.dataset.fija = "1";

        // El viaje tiene que TERMINAR dentro del video. El CTA cae al final del guion,
        // asi que un viaje de 1.5s se sale por el borde y la palabra se queda a medio
        // camino en el ultimo fotograma.
        const finVideo = parseFloat((raiz && raiz.dataset.duration) || 0) || Infinity;
        const arranca = salida + SALE + espera;
        // duracion 0 = no viaja: salta de una vez a su sitio y se queda quieta.
        if (!dur) {
          if (dx || dy) tl.set(mov, { x: dx, y: dy, scale: esc }, arranca);
          else if (esc !== 1) tl.set(mov, { scale: esc }, arranca);
          // se queda en su sitio: las parejas siguientes se apartan
          if (!dx && !dy) CTA_QUIETO = p.fin;
          return;
        }
        dur = Math.max(0.6, Math.min(dur, finVideo - arranca - 0.08));
        // Primero se aparta del centro y despues sube. En linea recta cruzaria por
        // encima del subtitulo siguiente y se leerian dos textos pisados; saliendo de
        // lado, cuando pasa por la altura del renglon ya no esta en medio.
        //
        // Va en UNA sola animacion con dos tramos, no en dos animaciones a la vez. Dos
        // tweens sobre el mismo elemento escriben cada uno la transformacion entera
        // desde su propio estado de partida, y al renderizar por saltos de fotograma
        // uno pisa al otro: paso — la palabra se apartaba de lado pero no subia.
        tl.to(mov, {
          keyframes: [
            { x: dx, y: dy * 0.22, scale: 1 - (1 - esc) * 0.25,
              duration: dur * 0.45, ease: "power2.out" },
            { x: dx, y: dy, scale: esc,
              duration: dur * 0.55, ease: "power2.inOut" },
          ],
        }, arranca);
      }

      // Minusculas salvo el arranque, igual que el resto del guion. Y sin puntos ni
      // comas: en las referencias no hay un solo signo en pantalla — la pausa la
      // marca el cambio de pareja, no la puntuacion. Las interrogaciones y las
      // exclamaciones si se quedan, que ahi cambian el tono de lo que se lee.
      function bajarSub(t, arranque) {
        let s = bajar(t);
        if ((CFG.subtitulo || {}).sin_puntos) s = s.replace(/[.,;:…]/g, "");
        return arranque ? capitalizar(s) : s;
      }

      // Las dos lineas tienen que caber en la zona segura sin partir palabras. Se
      // baja el cuerpo de LAS DOS a la vez para que no se pierda la jerarquia: la
      // grande siempre tiene que verse mas grande que la entradilla.
      // El ajuste se hace DOS veces: una ya, y otra cuando la fuente esta cargada.
      // La primera pasada mide con la fuente de reserva, que es mas estrecha, y por
      // eso creia que cabia texto que luego, ya con Inter, se salia por el borde o
      // se partia en dos renglones. Paso de verdad: "hombre esta perfecto," llegaba
      // hasta el canto derecho.
      function ajustarParejas() {
        PAREJAS_DIBUJADAS.forEach(([par, lead, clv]) => encogerPar(par, lead, clv));
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(ajustarParejas);
      }

      function encogerPar(par, lead, clv) {
        const S = CFG.subtitulo || {};
        let gr0 = S.cuerpo_clave || 106;
        const pq0 = S.cuerpo_lead || 82;
        if (clv.classList.contains("suelta")) gr0 *= S.suelta || 1.22;
        // El ancho util lo dice la CAJA, no una cuenta: #subs ya viene metido por el
        // margen de seguridad, asi que volver a restarlo achicaba el texto y ademas
        // hacia creer al codigo que cabia cuando ya se estaba partiendo.
        const raiz = document.querySelector("[data-composition-id]");
        const W = (raiz && raiz.getBoundingClientRect().width) || 1080;
        const tope = Math.min(par.clientWidth, W * (S.ancho_max || 0.80));
        // Cada linea se ajusta POR SU CUENTA. Encogerlas a la vez castigaba a la
        // entradilla por lo largo que fuera el renglon de abajo, y salia mucho mas
        // chica de lo que sale en las referencias.
        const cabe = (el, base) => {
          for (let f = 1.0; f >= 0.46; f -= 0.03) {
            el.style.fontSize = Math.round(base * f) + "px";
            if (el.scrollWidth <= tope) break;
          }
          return parseFloat(el.style.fontSize);
        };
        const grande = cabe(clv, gr0);
        if (!lead) return;
        // pero la de arriba NUNCA puede alcanzar a la de abajo: si se igualan se
        // pierde la jerarquia y el bloque deja de leerse como entradilla + remate.
        const techo = grande * (S.ratio_lead_max || 0.85);
        const chica = cabe(lead, pq0);
        if (chica > techo) lead.style.fontSize = Math.round(techo) + "px";
      }

      // ============ subtitulos ============
      // Se callan mientras hay keyword, stinger o lista: dos bloques de texto a
      // la vez rompen la lectura.
      // Los subtitulos llegan ya resueltos contra los bloques desde bin/cuadrar.py.
      // Antes se recortaban aqui, en tiempo de render, y por eso se perdian
      // palabras sin que nadie se enterara: ahora se decide en el montaje, se
      // audita con bin/auditar.py, y esto solo dibuja.
      // Las palabras que llevan acento salen de las keywords elegidas a mano: de cada
      // frase, la de mas cuerpo. Mismo criterio que en el formato de impacto.
      const norma = (t) => t.toLowerCase().normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9ñ]/g, "");
      const ENLACES_AC = new Set(["a","de","que","el","la","los","las","un","una","y","o","en",
        "con","por","para","su","tu","mi","se","te","me","lo","al","del","es","no","si","mas"]);
      const ACENTOS = new Set();
      KEYWORDS.forEach((k) => {
        const ws = (k.text || "").split(/\s+/).filter(Boolean);
        const cand = ws.filter((w) => !ENLACES_AC.has(norma(w)));
        const elegida = (cand.length ? cand : ws).reduce((a, b) =>
          norma(b).length > norma(a).length ? b : a, ws[0] || "");
        if (elegida) ACENTOS.add(norma(elegida));
      });

      const cont = document.getElementById("subs");
      if (CLASE_SUBS) cont.classList.add(CLASE_SUBS);
      if (DOS) pintarPares(cont);
      (DOS ? [] : CUES).forEach((c) => {
        const el = document.createElement("div");
        el.className = "cue";
        const S = CFG.subtitulo || {};
        let txt = S.mayusculas ? c.text : (esArranque(c.start) ? capitalizar(bajar(c.text)) : bajar(c.text));
        if (S.sin_puntos) txt = txt.replace(/[.,;:…]/g, "");
        // En el reflexivo el enfasis no es un bloque aparte: es una palabra en
        // CURSIVA y amarilla dentro de la propia linea. Se marca aqui, sobre el texto
        // ya compuesto, para no tener que inventar un pintador nuevo.
        if (S.acento_cursiva && ACENTOS.size) {
          el.innerHTML = txt.split(/(\s+)/).map((w) => {
            const n = norma(w);
            return (n && ACENTOS.has(n)) ? `<em>${w}</em>` : w;
          }).join("");
        } else if (c.italica) {
          // ITALICA (editorial): el prefijo en la grotesca y la palabra
          // clave debajo en serif italica, mas grande, que SUBE con fade.
          el.classList.add("dos");
          const pre = document.createElement("div"); pre.className = "pre"; pre.textContent = txt;
          const ita = document.createElement("div"); ita.className = "ita"; ita.textContent = bajar(c.italica);
          el.appendChild(pre); el.appendChild(ita);
          const IT = S.italica || {};
          tl.fromTo(ita, { opacity: 0, y: IT.sube_px != null ? IT.sube_px : 225 },
            { opacity: 1, y: 0, duration: IT.fade != null ? IT.fade : 0.27, ease: "power2.out" }, c.start);
        } else {
          el.textContent = txt;
        }
        cont.appendChild(el);
        // Cada modo tiene su propio cuerpo y su propio numero de lineas: el de TOP 10
        // admite dos renglones arriba, el reflexivo solo uno y mas pequeno.
        const cuerpo = S.cuerpo || 74;
        if (!c.italica) ajustar(el, S.lineas_max || 1, cuerpo, Math.round(cuerpo * 0.62));
        // SIN ANIMACION. El subtitulo normal aparece y desaparece de una: no
        // tiene entrada ni salida. Cambian cada ~0.94s, asi que un fundido en
        // cada uno solo produce parpadeo. La animacion es de los dinamicos.
        tl.set(el, { opacity: 1 }, c.start);
        tl.set(el, { opacity: 0 }, c.end);
      });

      // ============ props: recortes y tarjetas ============
      // Entran deslizando desde el borde en el que se apoyan y luego crecen muy
      // despacio, que es lo que hace que no se lean como una calcomania. Salen en
      // seco, sin fundido: un fundido de salida se cruza con el corte del plano y se
      // leen dos saltos donde deberia haber uno.
      const PROPS = window.__PROPS__ || [];
      // Las capturas se dibujan con `em`, y `em` cuelga del cuerpo que herede la caja
      // — que es el del documento, 16px. Salian ilegibles: tres puntitos grises donde
      // tenia que leerse un mensaje. El cuerpo se fija AQUI, a partir del alto real que
      // ha tomado la tarjeta, para que el texto escale con ella.
      function cuerpoCaptura(el) {
        const pila = el.querySelector(".cap-pila");
        if (pila) {
          const filas = Math.max(1, pila.querySelectorAll(".cap-dm").length);
          el.style.fontSize = (pila.getBoundingClientRect().height / filas) + "px";
          return;
        }
        const tel = el.querySelector(".cap-tel");
        if (tel) el.style.fontSize = (tel.getBoundingClientRect().height * 0.16) + "px";
      }

      PROPS.forEach((p) => {
        const el = document.getElementById("prop-" + p.i);
        if (!el) return;
        if (p.tipo === "captura") {
          cuerpoCaptura(el);
          // y otra vez con la fuente ya cargada, igual que las parejas
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => cuerpoCaptura(el));
          }
        }
        const lateral = p.sitio.endsWith("-der") || p.sitio === "der" ? 1 : -1;
        const desde = p.tipo === "tarjeta"
          ? { x: lateral * 90, y: -40, rotate: lateral * -3, scale: 0.92 }
          : { y: 120, scale: 0.96 };
        const ENTRA_P = 0.34;
        // La imagen del GANCHO no entra: ya esta puesta en el fotograma 0. Deslizando
        // tardaba tres decimas en verse y el primer golpe de vista se perdia, que es
        // justo lo que no puede pasar en el arranque. El resto de props si entran.
        if (p.at <= 0.001) {
          tl.set(el, { opacity: 1, x: 0, y: 0, rotate: 0, scale: 1 }, 0);
        } else {
          tl.fromTo(el, { opacity: 0, ...desde },
            { opacity: 1, x: 0, y: 0, rotate: 0, scale: 1,
              duration: ENTRA_P, ease: "back.out(1.6)" }, p.at);
        }
        // Las notificaciones caen de una en una, no las tres de golpe: asi se lee
        // como un telefono que va sonando, que es lo que cuenta la escena.
        const avisos = el.querySelectorAll(".cap-dm");
        if (avisos.length > 1) {
          avisos.forEach((a, k) => {
            tl.fromTo(a, { opacity: 0, y: -26, scale: 0.94 },
              { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(1.8)" },
              p.at + k * 0.34);
          });
        }
        // La OFERTA no se mueve: es una imagen de referencia, no un adorno. Moviendose
        // se lee como un fallo. El resto de props si respiran.
        if (p.tipo !== "oferta") {
          tl.to(el, { scale: 1.06, duration: p.dur, ease: "none" },
            p.at <= 0.001 ? 0 : p.at + ENTRA_P);
        }
        tl.set(el, { opacity: 0 }, p.at + p.dur);
      });

      // ============ lo que va DETRAS del que habla ============
      // No se le busca un hueco libre: se le pone detras. El recorte del sujeto se
      // pinta encima del elemento, asi que su cuerpo y sus manos pasan por delante y
      // el elemento no le tapa nunca — pase lo que pase con sus gestos.
      (window.__DETRAS__ || []).forEach((d) => {
        const el = document.getElementById("detras-" + d.i);
        if (!el) return;
        // `visibility` ademas de `opacity`: con solo opacity el revisor de contraste
        // sigue contando este video a pantalla completa como el fondo del texto y
        // marca cinco fallos que no existen.
        tl.set(el, { opacity: 1, visibility: "visible" }, d.at);
        tl.set(el, { opacity: 0, visibility: "hidden" }, d.at + d.dur);
      });

      // ============ rotulos del TOP 10 ============
      // El numero y el titulo del punto entran juntos y se quedan hasta el siguiente.
      (window.__ROTULOS__ || []).forEach((r) => {
        const el = document.createElement("div");
        el.className = "rot";
        const partes = [];
        if (r.img) partes.push(`<img src="props/top10/${r.img}" alt="">`);
        // "10 - NUNCA HAGAS X": el numero va en la MISMA linea que el texto.
        const sep = (CFG.rotulo || {}).separador != null ? CFG.rotulo.separador : " - ";
        // "1- Proteína", "2- Dormir Bien": Title Case como en la referencia (regla del
        // usuario: respetar las mayusculas en la numeracion). Las particulas quedan en minuscula.
        const PART = new Set(["de", "del", "la", "el", "los", "las", "en", "y", "a", "un", "una", "con", "por", "para", "tu", "tus", "que"]);
        const titulo = (t) => String(t).split(/(\s+)/).map((w, i) =>
          (/\s/.test(w) || (i > 0 && PART.has(w.toLowerCase()))) ? w : (w.charAt(0).toUpperCase() + w.slice(1))).join("");
        const txtRot = ((CFG.rotulo || {}).titulo_case !== false) ? titulo(r.txt || "") : (r.txt || "");
        const linea = [r.num ? `<span class="num">${r.num}</span>${sep}` : "", txtRot].join("");
        if (linea.trim()) partes.push(`<div class="linea">${linea}</div>`);
        el.innerHTML = partes.join("");
        document.getElementById("rotulos").appendChild(el);
        // como mucho dos renglones: un titulo largo baja su cuerpo hasta caber
        const lineaEl = el.querySelector(".linea");
        if (lineaEl) {
          const cuerpoRot = parseFloat(getComputedStyle(lineaEl).fontSize) || 100;
          const encajarRot = () => ajustar(lineaEl, (CFG.rotulo || {}).lineas_max || 2, cuerpoRot, Math.round(cuerpoRot * 0.55));
          encajarRot();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(encajarRot);
        }
        tl.fromTo(el, { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, r.at);
        tl.to(el, { opacity: 0, duration: 0.16, ease: "power2.in" }, r.at + r.dur);
        // Editorial: mientras hay un titulo de lista arriba, el subtitulo BAJA
        // (en la referencia pasa del 60% al 78%): dos textos no comparten la banda.
        const yRot = (CFG.subtitulo || {}).y_con_rotulo;
        if (yRot) {
          tl.set(document.documentElement, { "--sub-y": yRot }, r.at);
          tl.set(document.documentElement, { "--sub-y": (CFG.subtitulo || {}).y }, r.at + r.dur);
        }
      });

      // ============ gancho de apertura ============
      // Los tres ganchos caen juntos en el primer segundo: el VISUAL es este zoom
      // out (el video abre muy cerca de ella y se abre de golpe), el AUDITIVO es el
      // whoosh que sfx.py deja en el 0, y el de TEXTO es la primera frase animada.
      // Si el zoom durase mas de un segundo dejaria de ser un golpe y se leeria como
      // un movimiento de camara cualquiera.
      const ARR = CFG.arranque || {};
      // PRIMER FRAME (formato editorial): el video abre en un PRIMER PLANO de la
      // cara con el titulo ya puesto, aguanta `dur` y CORTA en seco al plano abierto
      // (o pasa por un destello blanco). Es la primera imagen que ve el pulgar: una
      // cara grande, no un salon. Medido en las 6 referencias: 0.25s de primer plano.
      if (ARR.modo === "primer_frame") {
        const foco = ARR.foco || "50% 32%";
        tl.set(".camara", { scale: ARR.escala || 2.0, transformOrigin: foco }, 0);
        const corte = ARR.dur != null ? ARR.dur : 0.25;
        tl.set(".camara", { scale: 1.0, transformOrigin: "50% 50%" }, corte);
        if (ARR.destello) {
          // el destello arranca EN el corte: tapa el salto y lo convierte en un golpe de luz
          tl.fromTo("#flash", { opacity: ARR.destello },
            { opacity: 0, duration: ARR.destello_dur || 0.22, ease: "power2.out" }, corte);
        }
      } else if (ARR.activo) {
        // Editorial: el zoom out arranca ANCLADO EN LA CARA (foco auto = bin/foco.py)
        // y dura 4-6 frames; desde el centro geometrico, a 2.4x la cabeza queda fuera.
        const PF = Object.assign({}, ARR, BEATS.primer_frame || {});
        const focoArr = PF.foco === "auto" ? (window.__FOCO__ || "50% 32%") : (PF.foco || "50% 50%");
        if (PF.foco) tl.set(".camara", { transformOrigin: focoArr }, 0);
        const escIni = (PF.escala === "auto" || ARR.escala === "auto")
          ? (window.__FOCO_ESCALA__ || 2.0)
          : (PF.escala || ARR.escala || 1.55);
        tl.fromTo(".camara", { scale: escIni },
          { scale: 1.0, duration: PF.duracion || ARR.duracion || 0.62, ease: ARR.ease || "power3.out" }, 0);
        if (PF.foco) tl.set(".camara", { transformOrigin: "50% 50%" }, (PF.duracion || ARR.duracion || 0.62) + 0.001);
        // Doble flash de silueta (ejemplo): blanco 0.20-0.30s y 0.37-0.43s. Aqui
        // sin matting: dos pulsos de blanco a pantalla completa.
        if (PF.destello_doble) {
          const sil = document.getElementById("silueta");
          if (sil) {
            // silueta blanca con bloom (el fondo sigue visible), como la referencia
            [[0.20, 0.30], [0.37, 0.43]].forEach(([a, b]) => {
              tl.set(sil, { opacity: 1, visibility: "visible" }, a);
              tl.set(sil, { opacity: 0, visibility: "hidden" }, b);
            });
            // y un velo blanco flojo a pantalla completa que da el 'lavado' del bloom
            const velo = PF.destello_velo != null ? PF.destello_velo : 0.28;
            tl.set("#flash", { opacity: velo }, 0.20); tl.set("#flash", { opacity: 0 }, 0.30);
            tl.set("#flash", { opacity: velo }, 0.37); tl.set("#flash", { opacity: 0 }, 0.43);
          } else {
            const op = PF.destello_op || 0.88;
            tl.set("#flash", { opacity: op }, 0.20); tl.set("#flash", { opacity: 0 }, 0.30);
            tl.set("#flash", { opacity: op }, 0.37); tl.set("#flash", { opacity: 0 }, 0.43);
          }
        }
        // Destello muy corto en el frame 0. Es lo que convierte el zoom out en un
        // GOLPE: sin el, la apertura se lee como un movimiento; con el, como un
        // impacto. Corto y flojo a proposito — un flash largo marea y se lee como
        // un fallo de edicion.
        if (ARR.destello) {
          tl.fromTo("#flash", { opacity: ARR.destello },
            { opacity: 0, duration: ARR.destello_dur || 0.16, ease: "power2.in" }, 0);
        }
        // y un rebote seco al aterrizar: el plano "encaja" en su sitio
        if (ARR.rebote) {
          tl.to(".camara", { scale: 1 + ARR.rebote, duration: 0.10, ease: "power2.out" },
            (ARR.duracion || 0.62) * 0.92);
          tl.to(".camara", { scale: 1.0, duration: 0.16, ease: "power2.inOut" },
            (ARR.duracion || 0.62) * 0.92 + 0.10);
        }
      }

      // ============ EDITORIAL: punch zoom en cada corte del A-roll ============
      // Camara en tripode y TODO el movimiento en post: en cada corte un punch
      // instantaneo (+10% para entrar, vuelta a base para salir, alternando) y dentro
      // del clip una deriva lenta de +3-5%/s que se suelta de golpe en el corte
      // siguiente. Punch 'hero' (+20%) en el titulo de seccion y en el CTA.
      const PC = ((CFG.estimulos || {}).punch_en_cortes) || {};
      const TRAMOS = window.__ZOOM_CORTES__ || [];
      if (PC.activo && TRAMOS.length) {
        // Cada tramo entre cortes trae su encuadre (escala) y, si es largo, hasta
        // donde deriva MUY despacio. El cambio de encuadre cae EN el corte, en seco:
        // se lee como un cambio de plano, no como un efecto.
        const heroes = new Set();
        if (window.__CLAVE__ && window.__CLAVE__.desde != null) heroes.add(window.__CLAVE__.desde);
        TRAMOS.forEach((tr) => {
          let esc = tr.escala;
          // el CTA entra con un punch algo mayor ('hero'), como en la referencia
          if ([...heroes].some((hh) => Math.abs(hh - tr.at) < 0.6)) esc = 1.0 + (PC.hero != null ? PC.hero : 0.14);
          tl.set(".camara", { scale: esc }, tr.at);
          if (tr.deriva_hasta != null && Math.abs(tr.deriva_hasta - esc) > 0.002) {
            tl.to(".camara", { scale: tr.deriva_hasta, duration: Math.max(0.1, tr.fin - tr.at - 0.02), ease: "none" }, tr.at + 0.01);
          }
        });
      }

      // ============ zoom de camara ============
      // Regla del video dopaminico: nunca mas de 3s sin estimulo.
      // Cuanto zoom, desde la configuracion. En un plano ya cerrado un empujon del
      // 12% ahoga: no deja respirar a la persona. El valor se elige por ENCUADRE.
      const EST = CFG.estimulos || {};
      const PUNCH = EST.zoom_punch != null ? EST.zoom_punch : 0.12;
      const SUAVE = EST.zoom_suave != null ? EST.zoom_suave : 0.09;
      // El golpe puede ser un corte seco o una rampa. Seco marca mas, pero rompe la
      // sensacion de pieza cara: el ojo lo lee como un salto de montaje. Las
      // duraciones tambien mandan desde el formato — un mismo recorrido en 1.6s o en
      // 2.6s es la diferencia entre "efecto" y "movimiento de camara".
      const SECO = EST.zoom_seco !== false;
      const D_ENTRA = EST.zoom_dur_entra || 1.6;
      const D_SALE = EST.zoom_dur_sale || 1.4;
      const D_PUNCH = EST.zoom_dur_punch || 0.9;
      let escala = 1.0;
      ZOOMS.forEach((z, i) => {
        // Un zoom lento no puede seguir andando cuando ya empezo el siguiente: dos
        // tweens sobre la misma escala se pisan, y al renderizar por saltos de
        // fotograma GSAP recoge el valor de partida equivocado y se ve un tirón. Cada
        // zoom se corta justo antes de que arranque el que viene detras.
        const hasta = ZOOMS[i + 1] ? ZOOMS[i + 1].at - 0.06 : Infinity;
        const cabe = (d) => Math.max(0.5, Math.min(d, hasta - z.at));
        if (z.tipo === "punch") {
          escala = escala > 1.005 ? 1.0 : 1 + PUNCH;
          if (SECO) tl.set(".camara", { scale: escala }, z.at);
          else tl.to(".camara", { scale: escala, duration: cabe(D_PUNCH), ease: "sine.inOut" }, z.at);
        } else if (z.tipo === "push") {
          escala += SUAVE;
          tl.to(".camara", { scale: escala, duration: cabe(D_ENTRA), ease: "sine.inOut" }, z.at);
        } else {
          escala = Math.max(1.0, escala - SUAVE);
          tl.to(".camara", { scale: escala, duration: cabe(D_SALE), ease: "sine.inOut" }, z.at);
        }
      });

      // ============ el numero del punto ============
      // Entra de golpe con un rebote, se queda mientras dura su punto y sale seco.
      // El chapon del numero es del formato de impacto. En TOP 10 el numero ya va
      // dentro de la propia linea de texto ("9. SEÑALA ALGO ALEATORIO"): repetirlo en
      // un cartel aparte es decir dos veces lo mismo, y encima se monta sobre la lamina.
      const NUMS = ((CFG.numeros || {}).activo === false) ? [] : (window.__NUMEROS__ || []);
      if (NUMS.length) {
        const cont = document.getElementById("numero");
        const sp = cont.querySelector("span");
        NUMS.forEach((nu) => {
          tl.set(sp, { textContent: String(nu.n) }, nu.at);
          tl.fromTo(cont, { opacity: 0, scale: 0.6, y: -26 },
            { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "back.out(2.4)" }, nu.at);
          // un pulso corto al entrar y despues quieto: llama sin marear
          tl.to(cont, { scale: 1.09, duration: 0.42, yoyo: true, repeat: 1,
                        ease: "sine.inOut" }, nu.at + 0.34);
          tl.to(cont, { opacity: 0, duration: 0.20, ease: "power2.in" }, nu.hasta);
        });
      }

      // ============ TITULO APILADO DEL GANCHO (editorial) ============
      // BEATS.gancho = { bloques: [ { at, fin, cada, lineas: [ {t, peso, dx, img} ] } ] }
      // Cada linea es texto LITERAL del habla (verificar.py lo comprueba). Entran una a
      // una, cada `cada` segundos (o con `at` propio), con un pop corto; el bloque se
      // va en seco cuando entra el siguiente o en `fin`.
      const GAN = (BEATS.gancho || {});
      const GCFG = CFG.titulo_gancho || {};
      (GAN.bloques || []).forEach((bl, bi, todos) => {
        const el = document.createElement("div");
        el.className = "bloque " + (bl.alinear || GCFG.alinear || "centro");
        if (bl.y != null) el.style.top = bl.y;
        (bl.lineas || []).forEach((ln) => {
          const d = document.createElement("div");
          d.className = "ln " + (ln.peso || "negrita") + (ln.grande ? " grande" : "");
          if (ln.dx) d.style.transform = `translateX(${ln.dx})`;
          // los digitos de una linea fina van mas grandes que su palabra ('las 3', '+40')
          const txt = ln.t || "";
          const esUltima = (bl.lineas || []).indexOf(ln) === (bl.lineas || []).length - 1;
          if ((ln.peso === "fina") && esUltima && /\d/.test(txt) && txt.split(/\s+/).length > 1) {
            d.innerHTML = txt.replace(/(\+?\d+)/g, '<span class="cifra">$1</span>');
          } else {
            d.textContent = txt;
          }
          if (ln.img) {
            const im = document.createElement("img");
            im.src = "props/" + ln.img; im.alt = "";
            d.appendChild(im);
          }
          el.appendChild(d);
        });
        document.getElementById("gancho").appendChild(el);
        const cada = bl.cada != null ? bl.cada : (GCFG.cada != null ? GCFG.cada : 0.5);
        const anim = bl.animacion || GCFG.animacion || "pop";
        const fin = bl.fin != null ? bl.fin
          : (bi + 1 < todos.length ? todos[bi + 1].at : (GCFG.dur_defecto || 4.0) + bl.at);
        tl.set(el, { opacity: 1 }, Math.max(0, bl.at - 0.01));
        [...el.querySelectorAll(".ln")].forEach((d, i) => {
          const ln = (bl.lineas || [])[i] || {};
          const t = ln.at != null ? ln.at : bl.at + i * cada;
          // En el frame 0 el titulo YA ESTA puesto (la referencia abre con la primera
          // linea escrita sobre el primer plano): sin animacion, o el primer frame sale vacio.
          if (t <= 0.02 || anim === "seco") {
            tl.set(d, { opacity: 1, scale: 1 }, t);
          } else if (false) {
            tl.set(d, { opacity: 1 }, t);
          } else if (anim === "fade") {
            tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, t);
          } else {   // pop: aparece con un empujon de escala muy corto, sin rebote largo
            tl.fromTo(d, { opacity: 0, scale: 0.86 },
              { opacity: 1, scale: 1, duration: 0.24, ease: "power3.out" }, t);
          }
        });
        // salida en seco: la referencia no funde, sustituye
        tl.set(el, { opacity: 0 }, fin);
        // Ninguna linea se sale del cuadro: si una frase larga ("comer todavia
        // menos" a 112px) no cabe en el ancho del bloque, se baja SU cuerpo hasta que
        // quepa. Se mide con la fuente ya cargada.
        const encajarLineas = () => {
          const ancho = el.clientWidth || (1080 * 0.84);
          [...el.querySelectorAll(".ln")].forEach((d) => {
            let px = parseFloat(getComputedStyle(d).fontSize) || 100;
            for (let i = 0; i < 24 && d.scrollWidth > ancho; i++) {
              px = Math.round(px * 0.95);
              d.style.fontSize = px + "px";
            }
          });
        };
        encajarLineas();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(encajarLineas);
        // ESCALERA (caro): la linea 1 anclada a la izquierda y las
        // siguientes corridas a la derecha con los bordes derechos a ras. Se mide
        // cuando la fuente ya esta cargada; antes, los anchos son de la fuente de reserva.
        if ((bl.alinear || GCFG.alinear) === "escalera") {
          const acomodar = () => {
            const lns = [...el.querySelectorAll(".ln")];
            if (!lns.length) return;
            const derecha = lns[0].offsetLeft + lns[0].offsetWidth + (bl.ensancha || 0);
            lns.slice(1).forEach((d, i) => {
              const ln = (bl.lineas || [])[i + 1] || {};
              if (ln.dx) return;                         // desplazamiento a mano: manda
              d.style.marginLeft = Math.max(0, derecha - d.offsetWidth) + "px";
            });
          };
          acomodar();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(acomodar);
        }
      });

      // la palabra clave entra cuando se dice y ya no se va
      const CLAVE = window.__CLAVE__ || null;
      // En dos lineas el CTA ya va en la propia linea grande, en ambar. El chapon
      // de arriba seria un segundo CTA a la vez y en las referencias no existe.
      if (CLAVE && CLAVE.palabra && !DOS) {
        const el = document.getElementById("clave");
        // Formato editorial: "Comenta" en blanco encima y la palabra en amarillo
        // entre comillas, sin pastilla. La referencia no lleva verbo suelto: lo escribe.
        const PK = CFG.palabra_clave || {};
        const conComenta = !!PK.comenta;
        if (conComenta) {
          el.classList.add("comenta");
          const c = document.createElement("div");
          c.className = "cmt";
          c.textContent = PK.comenta_texto || "Comenta";
          el.insertBefore(c, el.firstChild);
          // dos sitios (referencia): ARRIBA (centros 21%/27%) o ABAJO sobre la zona del
          // subtitulo (58%/66%, palabra mas grande). Lo elige el beat o el formato.
          const pos = (BEATS.cta || {}).posicion || PK.posicion || "arriba";
          el.style.top = pos === "abajo" ? (PK.y_abajo || "56.5%") : (PK.y || "18%");
          el.style.transform = "translateY(0)";   // `top` es el borde superior de "Comenta"
          if (pos === "abajo") {
            if (PK.cuerpo_abajo) el.querySelector("span").style.fontSize = PK.cuerpo_abajo + "px";
            if (PK.cuerpo_comenta_abajo) c.style.fontSize = PK.cuerpo_comenta_abajo + "px";
          }
        }
        // se ajusta si la palabra es larga, para no tocar los margenes
        const pxIni = conComenta ? (parseFloat(el.querySelector("span").style.fontSize) || PK.cuerpo || 135) : 138;
        // Se mide la PALABRA: el contenedor va de borde a borde y su scrollWidth es
        // siempre 1080, con lo que el bucle bajaba hasta 64px sin motivo.
        const spanK = el.querySelector("span");
        for (let px = pxIni; px >= 64; px -= 4) {
          spanK.style.fontSize = px + "px";
          if (spanK.getBoundingClientRect().width <= el.getBoundingClientRect().width * 0.82) break;
        }
        if (conComenta) {
          // la referencia entra EN SECO y no late: aparece y se queda
          tl.set(el, { opacity: 1 }, CLAVE.desde);
        } else {
          tl.fromTo(el, { opacity: 0, scale: 0.72, y: -18 },
            { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2.2)" }, CLAVE.desde);
          // un latido al entrar, para que se note, y despues quieta
          tl.to(el, { scale: 1.07, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" },
            CLAVE.desde + 0.42);
        }
      }

      tl.set({}, {}, {{DUR}});
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
